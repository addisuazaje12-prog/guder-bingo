<script>
(() => {
"use strict";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); } catch(e) {}
}

const API = "https://guder-bingo-server.onrender.com";
const initData = tg && tg.initData ? tg.initData : "";

let currentRoom = null;
let currentCartela = null;
let currentMatrix = null;
let lastSpokenNumber = null;

const $ = id => document.getElementById(id);

function toast(msg) {
  const el = $("toast");
  if (!el) return;
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = "none"; }, 4000);
}

function setStatus(msg, isErr = false) {
  const el = $("statusMessage");
  if (el) {
    el.textContent = msg;
    el.style.background = isErr ? "#49252b" : "#332b19";
  }
}

function headers() {
  return { "Content-Type": "application/json", "X-Telegram-Init-Data": initData };
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
  let data;
  try { data = await res.json(); } catch(e) { throw new Error("Server response error."); }
  if (!res.ok) throw new Error(data.message || "Request failed.");
  return data;
}

window.showSection = function(id) {
  ["gameSection", "depositSection", "walletSection", "historySection", "helpSection"].forEach(s => {
    const el = $(s);
    if (el) el.classList.toggle("hidden", s !== id);
  });
  if (id === "walletSection") refreshWallet();
  if (id === "historySection") loadHistory();
  if (id === "gameSection") refreshGame();
  if (id === "depositSection") loadConfig();
};

window.refreshWallet = async function() {
  try {
    const data = await api("/api/wallet");
    $("balance").textContent = Number(data.balance).toFixed(2) + " ETB";
    $("walletTransactions").innerHTML = data.transactions && data.transactions.length
      ? data.transactions.map(t => `<div class="item"><b>${t.txn_type}</b> · ${Number(t.amount).toFixed(2)} ETB<br><span class="muted">${t.created_at}</span></div>`).join("")
      : "No transactions yet.";
  } catch(e) { setStatus(e.message, true); }
};

async function loadConfig() {
  try {
    const cfg = await api("/api/config");
    $("paymentDetails").innerHTML = `<b>Telebirr:</b> ${cfg.telebirr_phone || "0913706670"}<br><span class="muted">Min deposit: 10.00 ETB</span>`;
  } catch(e) { $("paymentDetails").textContent = e.message; }
}

window.submitDeposit = async function(e) {
  e.preventDefault();
  const btn = $("depositSubmit");
  btn.disabled = true;
  $("depositResult").textContent = "Submitting deposit...";
  try {
    const data = await api("/api/deposit", {
      method: "POST",
      body: JSON.stringify({
        payment_method: $("paymentMethod").value,
        amount: Number($("depositAmount").value),
        payer_reference: $("payerReference").value.trim(),
        receipt_text: $("receiptText").value.trim()
      })
    });
    $("depositResult").textContent = data.message;
    $("depositForm").reset();
    toast("Deposit successful!");
    refreshWallet();
    refreshGame();
  } catch(err) {
    $("depositResult").textContent = err.message;
    toast(err.message);
  } finally { btn.disabled = false; }
};

async function refreshGame() {
  try {
    const data = await api("/api/game/state");
    $("balance").textContent = Number(data.balance || 0).toFixed(2) + " ETB";

    currentRoom = data.room;
    currentCartela = data.cartela;

    const roomInfo = $("roomInfo");
    const selectionArea = $("selectionArea");
    const cardArea = $("cardArea");

    if (!currentRoom) {
      roomInfo.textContent = "No active game room.";
      return;
    }

    roomInfo.innerHTML = `Room #${currentRoom.room_id} · Status: <b>${currentRoom.status}</b> · Pot: <b>${currentRoom.total_pot} ETB</b>`;

    // Render live called numbers for everyone
    renderLiveFeed(data.called_numbers || []);

    const userBalance = Number(data.balance || 0);

    if (currentCartela) {
      currentMatrix = JSON.parse(currentCartela.numbers_json);
      selectionArea.classList.add("hidden");
      cardArea.classList.remove("hidden");
      $("myCardLabel").textContent = "Your Cartela: #" + currentCartela.cartela_no;
      renderPlayerCard(data.called_numbers || []);
    } else {
      cardArea.classList.add("hidden");
      // Always show selection area so everyone can see it!
      selectionArea.classList.remove("hidden");

      if (userBalance < 10) {
        roomInfo.innerHTML += `<br><span style="color: #ffd77b;">👀 Spectator Mode: Visible to all. Deposit 10 ETB to play!</span>`;
      }
    }
  } catch(e) {
    setStatus(e.message, true);
  }
}

function makeCard() {
  const cols = [
    randomUnique(1, 15, 5),
    randomUnique(16, 30, 5),
    randomUnique(31, 45, 5),
    randomUnique(46, 60, 5),
    randomUnique(61, 75, 5)
  ];
  return Array.from({length: 5}, (_, r) => cols.map((col, c) => r === 2 && c === 2 ? "FREE" : col[r]));
}

function randomUnique(min, max, count) {
  const vals = [];
  while(vals.length < count) {
    const n = Math.floor(Math.random() * (max - min + 1)) + min;
    if (!vals.includes(n)) vals.push(n);
  }
  return vals;
}

window.selectCartela = async function() {
  if (!currentRoom) return;

  const userBalance = parseFloat($("balance").textContent) || 0;
  if (userBalance < 10) {
    toast("Insufficient balance! Please deposit at least 10 ETB to select a cartela.");
    return;
  }

  const btn = $("selectBtn");
  btn.disabled = true;
  try {
    const cartelaNo = Number($("cartelaNo").value);
    if (!cartelaNo || cartelaNo < 1 || cartelaNo > 800) throw new Error("Enter cartela 1-800.");
    
    const matrix = makeCard();
    const data = await api("/api/cartela/select", {
      method: "POST",
      body: JSON.stringify({ room_id: currentRoom.room_id, cartela_no: cartelaNo, numbers: matrix })
    });

    currentMatrix = matrix;
    currentCartela = { cartela_no: cartelaNo, numbers_json: JSON.stringify(matrix) };
    toast(data.message);
    refreshGame();
  } catch(e) {
    toast(e.message);
  } finally { btn.disabled = false; }
};

function renderLiveFeed(calls) {
  const latest = calls.length ? Number(calls[calls.length - 1].number) : null;
  $("latestCall").textContent = latest ? letterFor(latest) + " - " + latest : "Waiting for calls...";
  $("recentCalls").innerHTML = calls.slice(-10).reverse().map(c => `<span>${letterFor(c.number)}-${c.number}</span>`).join("");

  if (latest && latest !== lastSpokenNumber) {
    lastSpokenNumber = latest;
    speakAmharicNumber(latest);
  }
}

function renderPlayerCard(calls) {
  if (!currentMatrix) return;
  const called = new Set(calls.map(c => Number(c.number)));
  const board = $("bingoBoard");
  board.innerHTML = "";

  currentMatrix.forEach(row => {
    row.forEach(val => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = val;
      if (String(val).toUpperCase() === "FREE") cell.classList.add("free", "marked");
      else if (called.has(Number(val))) cell.classList.add("marked");
      board.appendChild(cell);
    });
  });
}

function letterFor(n) {
  if (n <= 15) return "B";
  if (n <= 30) return "I";
  if (n <= 45) return "N";
  if (n <= 60) return "G";
  return "O";
}

function speakAmharicNumber(n) {
  try {
    if ('speechSynthesis' in window) {
      const letter = letterFor(n);
      const utterance = new SpeechSynthesisUtterance(`ቁጥር ${letter} ${n}`);
      utterance.lang = 'am-ET';
      window.speechSynthesis.speak(utterance);
    }
  } catch(e) {}
}

window.claimBingo = async function() {
  if (!currentRoom || !currentCartela) return;
  const btn = $("bingoBtn");
  btn.disabled = true;
  try {
    const data = await api("/api/claim-bingo", {
      method: "POST",
      body: JSON.stringify({ room_id: currentRoom.room_id, cartela_no: currentCartela.cartela_no })
    });
    if (data.status === "winner") {
      const modal = $("bingoModal");
      const cd = $("modalCountdown");
      modal.classList.remove("hidden");
      let t = 5;
      cd.textContent = t;
      const timer = setInterval(() => {
        t--; cd.textContent = t;
        if (t <= 0) { clearInterval(timer); modal.classList.add("hidden"); }
      }, 1000);
      toast("Bingo verified!");
    } else {
      toast(data.message);
    }
  } catch(e) {
    toast(e.message);
  } finally { btn.disabled = false; refreshGame(); }
};

async function loadHistory() {
  try {
    const data = await api("/api/game/history");
    $("gameHistory").innerHTML = data.history && data.history.length
      ? data.history.map(x => `<div class="item">Room #${x.room_id} · Cartela #${x.cartela_no}<br><span class="muted">${x.created_at}</span></div>`).join("")
      : "No history yet.";
  } catch(e) { $("gameHistory").textContent = e.message; }
}

window.inviteFriends = function() {
  const share = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/guderbingo_bot") + "&text=" + encodeURIComponent("Join Guder Bingo & play live!");
  if (tg && tg.openTelegramLink) tg.openTelegramLink(share);
  else window.open(share, "_blank");
};

window.openSupport = function() {
  const url = "https://t.me/Guderbingosupport";
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url, "_blank");
};

async function init() {
  try {
    await loadConfig();
    await refreshWallet();
    await refreshGame();
  } catch(e) {
    setStatus("Running in offline view.", true);
  }
  setInterval(() => { try { refreshGame(); } catch(err){} }, 3000);
}

init();

})();
</script>
