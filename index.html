<script>
(() => {
"use strict";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const API = "https://guder-bingo-server.onrender.com";
const initData = tg && tg.initData ? tg.initData : "";

let currentRoom = null;
let currentCartela = null;
let currentMatrix = null;
let selectTimerInterval = null;
let prepTimerInterval = null;
let lastSpokenNum = null;

const $ = id => document.getElementById(id);

function renderFastCartelaGrid() {
  const container = $("fastCartelaContainer");
  if (!container || container.children.length > 0) return;
  let html = "";
  for (let i = 1; i <= 800; i++) {
    html += `<button id="c_btn_${i}" class="cartela-btn" onclick="selectFastCartela(${i})">#${i}</button>`;
  }
  container.innerHTML = html;
}

// Amharic Voice Number Calling using Web Speech API
function speakAmharicNumber(number) {
  if (!('speechSynthesis' in window)) return;
  if (lastSpokenNum === number) return;
  lastSpokenNum = number;

  const utterance = new SpeechSynthesisUtterance(`ቁጥር ${number}`);
  utterance.lang = 'am-ET'; // Amharic
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = "none"; }, 4000);
}

function setStatus(message, error = false) {
  $("statusMessage").textContent = message;
  $("statusMessage").style.background = error ? "#49252b" : "#332b19";
}

async function api(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData, ...(options.headers || {}) }
  });
  
  const contentType = response.headers.get("content-type");
  if (!contentType || !contentType.includes("application/json")) {
    const text = await response.text();
    throw new Error(`ሰርቨሩ ትክክለኛ ያልሆነ ምላሽ ሰጥቷል: ${text.substring(0, 80)}`);
  }

  const data = await response.json();
  if (!response.ok) throw new Error(data.message || "ጥያቄው አልተሳካም።");
  return data;
}

window.showSection = function(id) {
  ["gameSection", "depositSection", "walletSection", "historySection", "managerSection", "helpSection"].forEach(section => {
    $(section).classList.toggle("hidden", section !== id);
  });
  if (id === "walletSection") refreshWallet();
  if (id === "historySection") loadHistory();
  if (id === "managerSection") loadManagerSessions();
  if (id === "gameSection") refreshGame();
  if (id === "depositSection") loadConfig();
};

window.refreshWallet = async function() {
  try {
    const data = await api("/api/wallet");
    $("balance").textContent = Number(data.balance).toFixed(2) + " ETB";
    $("walletTransactions").innerHTML = data.transactions.length
      ? data.transactions.map(t => `<div class="item"><b>${t.txn_type}</b> · ${Number(t.amount).toFixed(2)} ETB<br><span class="muted">${t.created_at}</span></div>`).join("")
      : " እስካሁን ምንም የኪስ ቦርሳ ግብይት የለም።";
  } catch (e) { setStatus(e.message, true); }
};

async function loadConfig() {
  try {
    const config = await api("/api/config");
    const phone = config.telebirr_phone || "0913706670";
    $("paymentDetails").innerHTML = `<b>የቴሌብር የክፍያ ቁጥር:</b> <code>${phone}</code><br><span class="muted">ዝቅተኛው የငွေ መጠን 10.00 ብር ነው።</span>`;
  } catch (e) { $("paymentDetails").textContent = e.message; }
}

window.submitDeposit = async function(event) {
  event.preventDefault();
  const button = $("depositSubmit");
  button.disabled = true;
  $("depositResult").textContent = "ደረሰኝ በመላክ ላይ...";
  try {
    const data = await api("/api/deposit", {
      method: "POST",
      body: JSON.stringify({
        payment_method: $("paymentMethod").value,
        amount: Number($("depositAmount").value),
        payer_reference: $("payerReference").value.trim(),
        receipt_text: $("receiptText").value.trim()
      })
    });
    $("depositResult").textContent = data.message;
    $("depositForm").reset();
    toast("ደረሰኝዎ ተልኳል።");
    refreshWallet();
  } catch (e) {
    $("depositResult").textContent = e.message;
    toast(e.message);
  } finally { button.disabled = false; }
};

// Selection 30-second Countdown Timer
function startSelectTimer() {
  clearInterval(selectTimerInterval);
  let timeLeft = 30;
  $("selectTimer").textContent = timeLeft;
  selectTimerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft >= 0) {
      $("selectTimer").textContent = timeLeft;
    } else {
      clearInterval(selectTimerInterval);
    }
  }, 1000);
}

async function refreshGame() {
  try {
    const data = await api("/api/game/state");
    $("balance").textContent = Number(data.balance || 0).toFixed(2) + " ETB";
    currentRoom = data.room;
    currentCartela = data.cartela;

    if (!currentRoom) {
      $("roomInfo").textContent = "በአሁኑ ሰዓት ምንም ንቁ የጨዋታ ክፍል የለም።";
      $("selectionArea").classList.add("hidden");
      $("cardArea").classList.add("hidden");
      return;
    }

    $("roomInfo").textContent = `ክፍል (Room) #${currentRoom.room_id} · ሁኔታ: ${currentRoom.status}`;

    if (currentCartela) {
      currentMatrix = JSON.parse(currentCartela.numbers_json || '[[1,16,31,46,61],[2,17,32,47,62],[3,18,"FREE",48,63],[4,19,34,49,64],[5,20,35,50,65]]');
      $("selectionArea").classList.add("hidden");
      $("cardArea").classList.remove("hidden");
      $("myCardLabel").textContent = "የእርስዎ ካርቴላ: #" + currentCartela.cartela_no;
      
      const calls = data.called_numbers || [];
      renderCard(calls);

      if (calls.length > 0) {
        const latest = calls[calls.length - 1].number;
        $("latestCall").textContent = latest;
        speakAmharicNumber(latest);
        $("recentCalls").innerHTML = calls.slice(-5).map(c => `<span>${c.number}</span>`).join("");
      }
    } else {
      $("cardArea").classList.add("hidden");
      const canSelect = ["OPEN", "REGISTRATION"].includes(currentRoom.status) && Number(data.balance) >= 10;
      $("selectionArea").classList.toggle("hidden", !canSelect);
      if (canSelect) {
        renderFastCartelaGrid();
        startSelectTimer();
      }
    }
  } catch (e) { setStatus(e.message, true); }
}

window.selectFastCartela = async function(cartelaNo) {
  if (!currentRoom) return;
  const btn = $(`c_btn_${cartelaNo}`);
  if (btn) btn.classList.add("selected-gold");

  try {
    const matrix = [[1,16,31,46,61],[2,17,32,47,62],[3,18,"FREE",48,63],[4,19,34,49,64],[5,20,35,50,65]];
    await api("/api/cartela/select", {
      method: "POST",
      body: JSON.stringify({ room_id: currentRoom.room_id, cartela_no: cartelaNo, numbers: matrix })
    });
    if (btn) {
      btn.classList.remove("selected-gold");
      btn.classList.add("selected-green");
    }
    currentMatrix = matrix;
    currentCartela = { cartela_no: cartelaNo };
    $("selectionArea").classList.add("hidden");
    $("cardArea").classList.remove("hidden");
    renderCard([]);
    toast(`ካርቴላ #${cartelaNo} ተመርጧል!`);
    refreshGame();
  } catch (e) {
    if (btn) btn.classList.remove("selected-gold");
    toast(e.message);
  }
};

function renderCard(calls) {
  if (!currentMatrix) return;
  const called = new Set(calls.map(c => Number(c.number)));
  const board = $("bingoBoard");
  board.innerHTML = "";
  currentMatrix.forEach(row => {
    row.forEach(val => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = val;
      if (String(val).toUpperCase() === "FREE" || called.has(Number(val))) {
        cell.classList.add("marked");
      }
      board.appendChild(cell);
    });
  });
}

// Claim Bingo & 5-second Modal Countdown
window.claimBingo = async function() {
  if (!currentCartela || !currentRoom) {
    toast("እባክዎ መጀመሪያ ካርቴላ ይምረጡ!");
    return;
  }

  try {
    const data = await api("/api/claim-bingo", {
      method: "POST",
      body: JSON.stringify({ room_id: currentRoom.room_id, cartela_no: currentCartela.cartela_no })
    });

    $("modalWinnerMsg").textContent = `እንኳን ደስ አላችሁ! ${data.prize_allocated} ብር አሸንፈዋል!`;
    $("bingoModal").classList.remove("hidden");

    let count = 5;
    $("modalCountdown").textContent = count;
    const modalInterval = setInterval(() => {
      count--;
      if (count > 0) {
        $("modalCountdown").textContent = count;
      } else {
        clearInterval(modalInterval);
        $("bingoModal").classList.add("hidden");
        refreshGame();
      }
    }, 1000);

  } catch (e) {
    toast(e.message);
  }
};

async function loadHistory() {
  const data = await api("/api/game/history");
  $("gameHistory").innerHTML = "የጨዋታ ታሪክ ተጭኗል።";
}

async function loadManagerSessions() {
  const data = await api("/api/manager/sessions");
  $("managerSessions").innerHTML = (data.winners || []).length 
    ? data.winners.map(w => `<div class="item">ስልክ: ${w.phone_number} · ሽልማት: ${w.amount} ETB</div>`).join("") 
    : "ለአሁኑ ክፍለ ጊዜ አሸናፊዎች የሉም።";
}

window.openSupport = function() {
  window.open("https://t.me/Guderbingosupport", "_blank");
};

init();
async function init() {
  if (!tg || !initData) return;
  await loadConfig();
  await refreshWallet();
  await refreshGame();
  setInterval(refreshGame, 3000);
}
})();
</script>
