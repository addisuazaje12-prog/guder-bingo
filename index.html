</head>
<body onload="initApp()">

    <div class="top-stats" id="topStats" style="display:none;">
        <div>Game ID<span id="gameIdVal">#1</span></div>
        <div>Derash<span id="derashVal">0</span></div>
        <div>Phase<span id="phaseVal">OPEN</span></div>
        <div>Stake<span id="stakeVal">10</span></div>
        <div>Called<span id="calledVal">0</span></div>
    </div>

    <div class="main-container" id="mainContainer"></div>

    <div id="bottomNavContainer">
        <div class="bottom-nav">
            <button type="button" class="nav-btn" onclick="switchTab('game')">🎮 Game</button>
            <button type="button" class="nav-btn" onclick="switchTab('history')">📜 History</button>
            <button type="button" class="nav-btn" onclick="inviteFriends()">👥 Invite</button>
            <button type="button" class="nav-btn" onclick="switchTab('wallet')">💳 Wallet</button>
            <button type="button" class="nav-btn" onclick="switchTab('director')">⚙️ Director</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const BACKEND_CANDIDATES = [
            "https://guder-bingo-b0wz.onrender.com",
            "https://guder-bingo.onrender.com",
            "https://guder-bingo-server.onrender.com",
            "https://guder-bingo-phase1.onrender.com"
        ];
        const API_BASE_URL = window.location.hostname.includes("onrender.com")
            ? window.location.origin
            : BACKEND_CANDIDATES[0];

        const MIN_STAKE_ETB = 10.0;
        const MAX_CARTELA_NO = 800;

        let userBalance = 0.0;
        let roundPhase = "SELECTION";
        let selectionSecondsLeft = 30;
        let prepSecondsLeft = 5;

        let phaseTicker = null;
        let callTicker = null;

        let selectedCartelaNo = null;
        let selectedCartelaMatrix = null;
        let calledNumbersList = [];
        let callAudioQueue = [];
        let isDrainingAudioQueue = false;
        let activeCallAudio = null;
        let audioUnlocked = false;
        let lastAudioStatusText = "Tap screen or Test Sound for Amharic voice";

        const verifiedWinnersList = [
            { name: "አሸናፊ 1", phone: "0911000000", session: "Session #1 - 2026-11-20 09:00" },
            { name: "አሸናፊ 2", phone: "0912000000", session: "Session #2 - 2026-11-21 15:30" }
        ];

        function formatCallCode(num) {
            const n = Number(num);
            if (!Number.isInteger(n) || n < 1 || n > 75) return String(num || "--");
            if (n <= 15) return `B${n}`;
            if (n <= 30) return `I${n}`;
            if (n <= 45) return `N${n}`;
            if (n <= 60) return `G${n}`;
            return `O${n}`;
        }

        function getAudioFilenameForNumber(num) {
            const code = formatCallCode(num);
            if (code === "--") return null;
            return `${code.toLowerCase()}.mp3`;
        }

        function setAudioStatus(msg) {
            lastAudioStatusText = msg;
            const el = document.getElementById("audioStatusBar");
            if (el) el.textContent = msg;
        }

        function unlockAudioOnce() {
            audioUnlocked = true;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    if (ctx.state === "suspended") ctx.resume().catch(() => {});
                }
            } catch (_) {}
            if (callAudioQueue.length > 0 && !isDrainingAudioQueue) {
                drainAudioQueue();
            }
        }
        document.addEventListener("pointerdown", unlockAudioOnce, { passive: true });
        document.addEventListener("touchstart", unlockAudioOnce, { passive: true });
        document.addEventListener("click", unlockAudioOnce, { passive: true });

        function stopActiveCallAudio() {
            callAudioQueue = [];
            isDrainingAudioQueue = false;
            if (activeCallAudio) {
                activeCallAudio.onended = null;
                activeCallAudio.onerror = null;
                activeCallAudio.pause();
                activeCallAudio.src = "";
                activeCallAudio = null;
            }
        }

        function drainAudioQueue() {
            if (isDrainingAudioQueue || callAudioQueue.length === 0) return;
            const nextFile = callAudioQueue[0];
            isDrainingAudioQueue = true;

            const primaryBase = BACKEND_CANDIDATES[0];
            const audioUrls = [
                `${primaryBase}/audio/${nextFile}`,
                `${primaryBase}/static/audio/${nextFile}`,
                `${primaryBase}/${nextFile}`,
                `bingo_amharic_audio/${nextFile}`
            ];

            let idx = 0;
            const finishItem = () => {
                callAudioQueue.shift();
                activeCallAudio = null;
                isDrainingAudioQueue = false;
                if (callAudioQueue.length > 0) {
                    setTimeout(drainAudioQueue, 120);
                }
            };

            const tryNext = () => {
                if (idx >= audioUrls.length) {
                    setAudioStatus(`⚠️ Audio missing: ${nextFile}`);
                    finishItem();
                    return;
                }
                const url = audioUrls[idx++];
                const audio = new Audio();
                audio.preload = "auto";
                audio.src = url;
                activeCallAudio = audio;

                audio.onended = () => {
                    setAudioStatus(`🔊 Played ${nextFile}`);
                    finishItem();
                };
                audio.onerror = () => {
                    activeCallAudio = null;
                    tryNext();
                };

                const playPromise = audio.play();
                if (playPromise && typeof playPromise.then === "function") {
                    playPromise.then(() => {
                        setAudioStatus(`🔊 Calling ${nextFile}...`);
                    }).catch((err) => {
                        activeCallAudio = null;
                        if (!audioUnlocked && err && err.name === "NotAllowedError") {
                            isDrainingAudioQueue = false;
                            setAudioStatus(`👆 Tap to play ${nextFile}`);
                        } else {
                            tryNext();
                        }
                    });
                }
            };

            tryNext();
        }

        function enqueueCallAudio(fileName) {
            if (!fileName) return;
            if (!callAudioQueue.includes(fileName)) {
                callAudioQueue.push(fileName);
            }
            drainAudioQueue();
        }

        function playWinnerAmharicSound() {
            unlockAudioOnce();
            setAudioStatus("🏆 አሸናፊ ተረጋግጧል! (bingo.mp3)");
            enqueueCallAudio("bingo.mp3");
        }

        function testAmharicAudio(sampleNum = 1) {
            unlockAudioOnce();
            const file = getAudioFilenameForNumber(sampleNum) || "b1.mp3";
            setAudioStatus(`Testing ${file}...`);
            enqueueCallAudio(file);
        }

        function clearAllLoops() {
            if (phaseTicker) { clearInterval(phaseTicker); phaseTicker = null; }
            if (callTicker) { clearInterval(callTicker); callTicker = null; }
        }

        function inviteFriends() {
            const botUsername = "guderbingo_bot";
            const refSuffix = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id
                ? `?start=ref_${tg.initDataUnsafe.user.id}`
                : "";
            const inviteText = encodeURIComponent("🎮 Come play Guder Bingo with me and win! Join the live game here:");
            const shareUrl = `https://t.me/share/url?url=https://t.me/${botUsername}${refSuffix}&text=${inviteText}`;
            if (tg && tg.openTelegramLink) tg.openTelegramLink(shareUrl);
            else window.open(shareUrl, "_blank");
        }

        function generateCartelaMatrix(cartelaNo) {
            let seed = Number(cartelaNo || 1) * 13;
            function nextRand(min, max, excludeList) {
                seed = (seed * 9301 + 49297) % 233280;
                let r = min + Math.floor((seed / 233280) * (max - min + 1));
                while (excludeList.includes(r)) {
                    seed = (seed * 9301 + 49297) % 233280;
                    r = min + Math.floor((seed / 233280) * (max - min + 1));
                }
                return r;
            }
            const colB = [], colI = [], colN = [], colG = [], colO = [];
            while (colB.length < 5) colB.push(nextRand(1, 15, colB));
            while (colI.length < 5) colI.push(nextRand(16, 30, colI));
            while (colN.length < 4) colN.push(nextRand(31, 45, colN));
            while (colG.length < 5) colG.push(nextRand(46, 60, colG));
            while (colO.length < 5) colO.push(nextRand(61, 75, colO));

            const matrix = [];
            for (let row = 0; row < 5; row++) {
                const nVal = row === 2 ? "FREE" : colN[row > 2 ? row - 1 : row];
                matrix.push([colB[row], colI[row], nVal, colG[row], colO[row]]);
            }
            return matrix;
        }

        function initApp() {
            showGateScreen();
        }

        function showGateScreen() {
            clearAllLoops();
            stopActiveCallAudio();
            document.getElementById("topStats").style.display = "none";
            document.getElementById("mainContainer").innerHTML = `
                <div class="start-screen">
                    <h2>Guder Bingo</h2>
                    <p style="font-weight: 800; color: #ffb703; margin-bottom: 8px;">እንኳን ወደ ጉደር ቢንጎ ጨዋታ በሰላም መጡ !</p>
                    <p>ጨዋታ ለመጀመር በቴሌግራም ቦቱ የ ሜሴጅ መጻፊያ ላይ /start የሚል በመጻፍ deposit በሚለው ውስጥ ገንዘብ ያስተላልፉ !</p>
                    <button type="button" class="btn-start-game" onclick="startAppSession()">▶ Start Game</button>
                </div>
            `;
        }

        function startAppSession() {
            unlockAudioOnce();
            startSelectionPhase(30);
        }

        function startSelectionPhase(seconds = 30) {
            clearAllLoops();
            stopActiveCallAudio();
            roundPhase = "SELECTION";
            selectionSecondsLeft = seconds;
            selectedCartelaNo = null;
            selectedCartelaMatrix = null;
            calledNumbersList = [];

            document.getElementById("topStats").style.display = "none";
            document.getElementById("bottomNavContainer").innerHTML = `
                <div class="bottom-nav">
                    <button type="button" class="nav-btn" onclick="switchTab('game')">🎮 Game</button>
                    <button type="button" class="nav-btn" onclick="switchTab('history')">📜 History</button>
                    <button type="button" class="nav-btn" onclick="inviteFriends()">👥 Invite</button>
                    <button type="button" class="nav-btn" onclick="switchTab('wallet')">💳 Wallet</button>
                    <button type="button" class="nav-btn" onclick="switchTab('director')">⚙️ Director</button>
                </div>
            `;

            const container = document.getElementById("mainContainer");
            let html = `
                <div class="low-balance-banner" id="lowBalanceBanner"></div>
                <div class="timer-banner" id="selectionBanner">ካርቴላ ይምረጡ (1–800) • ጊዜ: ${selectionSecondsLeft}s • ${userBalance.toFixed(2)} ETB</div>
                <div class="cartela-grid">
            `;
            for (let i = 1; i <= MAX_CARTELA_NO; i++) {
                html += `<div class="cartela-opt" id="cart-${i}" onclick="selectCartela(${i})">${i}</div>`;
            }
            html += `</div>`;
            container.innerHTML = html;

            phaseTicker = setInterval(() => {
                selectionSecondsLeft -= 1;
                const banner = document.getElementById("selectionBanner");
                if (banner) {
                    banner.textContent = `ካርቴላ ይምረጡ (1–800) • ጊዜ: ${Math.max(0, selectionSecondsLeft)}s • ${userBalance.toFixed(2)} ETB`;
                }
                if (selectionSecondsLeft <= 0) {
                    clearInterval(phaseTicker);
                    phaseTicker = null;
                    startPreparationPhase(5);
                }
            }, 1000);
        }

        function selectCartela(cartelaNo) {
            if (roundPhase !== "SELECTION") return;
            const lowBanner = document.getElementById("lowBalanceBanner");

            if (Number(userBalance) < MIN_STAKE_ETB) {
                if (lowBanner) {
                    lowBanner.textContent = `insufficient balance (Cartela #${cartelaNo} requires ${MIN_STAKE_ETB} ETB • You can still watch & play)`;
                    lowBanner.style.display = "block";
                }
                return;
            }

            if (lowBanner) {
                lowBanner.style.display = "none";
                lowBanner.textContent = "";
            }

            if (selectedCartelaNo) {
                const prev = document.getElementById(`cart-${selectedCartelaNo}`);
                if (prev) prev.classList.remove("selected");
            }
            selectedCartelaNo = cartelaNo;
            selectedCartelaMatrix = generateCartelaMatrix(cartelaNo);
            const el = document.getElementById(`cart-${cartelaNo}`);
            if (el) el.classList.add("selected");
            enqueueCallAudio("b1.mp3");
        }

        function startPreparationPhase(seconds = 5) {
            if (phaseTicker) { clearInterval(phaseTicker); phaseTicker = null; }
            roundPhase = "PREPARING";
            prepSecondsLeft = seconds;
            if (!selectedCartelaNo) {
                selectedCartelaNo = 1;
                selectedCartelaMatrix = generateCartelaMatrix(1);
            }
            renderCallingBoard();

            phaseTicker = setInterval(() => {
                prepSecondsLeft -= 1;
                const phaseEl = document.getElementById("phaseVal");
                if (phaseEl) phaseEl.textContent = `PREP ${Math.max(0, prepSecondsLeft)}s`;
                setAudioStatus(`⏳ ጨዋታ በ ${Math.max(0, prepSecondsLeft)} ሰከንድ ይጀምራል...`);
                if (prepSecondsLeft <= 0) {
                    clearInterval(phaseTicker);
                    phaseTicker = null;
                    startCallingPhase();
                }
            }, 1000);
        }

        function updateCallerUI() {
            const lastNum = calledNumbersList.length ? calledNumbersList[calledNumbersList.length - 1] : null;
            const callCode = lastNum ? formatCallCode(lastNum) : "--";
            const circle = document.getElementById("currentCallCircle");
            if (circle) circle.textContent = callCode;

            const calledVal = document.getElementById("calledVal");
            if (calledVal) calledVal.textContent = String(calledNumbersList.length);

            if (lastNum) {
                const cell = document.getElementById(`num-${lastNum}`);
                if (cell) cell.classList.add("called");
            }

            const recentPills = document.getElementById("recentPills");
            if (recentPills) {
                const lastThree = calledNumbersList.slice(-3).reverse();
                recentPills.innerHTML = lastThree.length
                    ? lastThree.map(n => `<div class="recent-pill">${formatCallCode(n)}</div>`).join("")
                    : `<div class="recent-pill">-</div>`;
            }
        }

        function startCallingPhase() {
            roundPhase = "RUNNING";
            const phaseEl = document.getElementById("phaseVal");
            if (phaseEl) phaseEl.textContent = "RUNNING";
            setAudioStatus("🎙️ የቁጥር ጥሪ ጀምሯል (1–75)");

            if (callTicker) clearInterval(callTicker);
            callTicker = setInterval(() => {
                if (roundPhase !== "RUNNING") return;
                const calledSet = new Set(calledNumbersList);
                const available = [];
                for (let n = 1; n <= 75; n++) {
                    if (!calledSet.has(n)) available.push(n);
                }
                if (available.length === 0) {
                    clearInterval(callTicker);
                    callTicker = null;
                    return;
                }
                const nextNum = available[Math.floor(Math.random() * available.length)];
                calledNumbersList.push(nextNum);
                updateCallerUI();

                const audioFile = getAudioFilenameForNumber(nextNum);
                if (audioFile) {
                    enqueueCallAudio(audioFile);
                }
            }, 4000);
        }

        function renderCallingBoard() {
            document.getElementById("topStats").style.display = "grid";
            document.getElementById("bottomNavContainer").innerHTML = `
                <div class="game-footer-actions">
                    <button type="button" class="btn-leave" onclick="startSelectionPhase(30)">Leave</button>
                    <button type="button" class="btn-refresh" onclick="window.location.reload()">Refresh</button>
                    <button type="button" class="btn-bingo" onclick="claimBingo()">BINGO (አሸናፊ)</button>
                </div>
            `;

            const ranges = [
                { start: 1, end: 15 },
                { start: 16, end: 30 },
                { start: 31, end: 45 },
                { start: 46, end: 60 },
                { start: 61, end: 75 }
            ];

            let colsHtml = "";
            for (const r of ranges) {
                let cellsHtml = "";
                for (let n = r.start; n <= r.end; n++) {
                    const isCalled = calledNumbersList.includes(n);
                    cellsHtml += `<div class="num-cell ${isCalled ? "called" : ""}" id="num-${n}">${n}</div>`;
                }
                colsHtml += `<div class="bingo-col-group">${cellsHtml}</div>`;
            }

            const matrix = selectedCartelaMatrix || generateCartelaMatrix(selectedCartelaNo || 1);
            let cardCellsHtml = "";
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const val = matrix[row][col];
                    if (val === "FREE") {
                        cardCellsHtml += `<div class="player-cell free marked" onclick="togglePlayerCell(this)">FREE</div>`;
                    } else {
                        cardCellsHtml += `<div class="player-cell" onclick="togglePlayerCell(this)">${val}</div>`;
                    }
                }
            }

            const lastNum = calledNumbersList.length ? calledNumbersList[calledNumbersList.length - 1] : null;
            const callCode = lastNum ? formatCallCode(lastNum) : "--";
            const recentThree = calledNumbersList.slice(-3).reverse();
            const recentHtml = recentThree.length
                ? recentThree.map(n => `<div class="recent-pill">${formatCallCode(n)}</div>`).join("")
                : `<div class="recent-pill">-</div>`;

            document.getElementById("mainContainer").innerHTML = `
                <div class="winner-banner" id="winnerBanner"></div>
                <div class="calling-layout">
                    <div class="left-column">
                        <div class="bing-column-container">
                            <div class="bingo-header-row">
                                <div class="bingo-letter">B</div>
                                <div class="bingo-letter">I</div>
                                <div class="bingo-letter">N</div>
                                <div class="bingo-letter">G</div>
                                <div class="bingo-letter">O</div>
                            </div>
                            <div class="num-grid-75">${colsHtml}</div>
                        </div>
                    </div>
                    <div class="right-column">
                        <div class="caller-panel">
                            <div class="current-call-box">
                                <span>ጥሪ</span>
                                <div class="call-circle" id="currentCallCircle">${callCode}</div>
                            </div>
                            <div class="recent-calls" id="recentPills">${recentHtml}</div>
                            <div class="audio-status-bar" id="audioStatusBar">${lastAudioStatusText}</div>
                            <button type="button" class="btn-action-sm" onclick="testAmharicAudio(lastNum || 1)">🔊 Test Sound</button>
                            <button type="button" class="btn-claim-bingo" onclick="claimBingo()">🏆 BINGO</button>
                        </div>
                        <div class="player-cartela-box">
                            <div class="player-cartela-title">Cartela #${selectedCartelaNo || 1}</div>
                            <div class="player-bingo-header">
                                <div class="player-bingo-letter">B</div>
                                <div class="player-bingo-letter">I</div>
                                <div class="player-bingo-letter">N</div>
                                <div class="player-bingo-letter">G</div>
                                <div class="player-bingo-letter">O</div>
                            </div>
                            <div class="player-card-grid">${cardCellsHtml}</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("calledVal").textContent = String(calledNumbersList.length);
            document.getElementById("stakeVal").textContent = String(MIN_STAKE_ETB);
        }

        function togglePlayerCell(cell) {
            if (!cell) return;
            cell.classList.toggle("marked");
        }

        function claimBingo() {
            playWinnerAmharicSound();
            const wb = document.getElementById("winnerBanner");
            if (wb) {
                wb.textContent = `🏆 Cartela #${selectedCartelaNo || 1} BINGO Claimed!`;
                wb.style.display = "block";
            }
        }

        function switchTab(tabName) {
            clearAllLoops();
            stopActiveCallAudio();
            document.getElementById("topStats").style.display = "none";
            document.getElementById("bottomNavContainer").innerHTML = `
                <div class="bottom-nav">
                    <button type="button" class="nav-btn" onclick="switchTab('game')">🎮 Game</button>
                    <button type="button" class="nav-btn" onclick="switchTab('history')">📜 History</button>
                    <button type="button" class="nav-btn" onclick="inviteFriends()">👥 Invite</button>
                    <button type="button" class="nav-btn" onclick="switchTab('wallet')">💳 Wallet</button>
                    <button type="button" class="nav-btn" onclick="switchTab('director')">⚙️ Director</button>
                </div>
            `;

            const container = document.getElementById("mainContainer");
            if (tabName === "game") {
                startSelectionPhase(30);
                return;
            }
            if (tabName === "wallet") {
                container.innerHTML = `
                    <div class="wallet-box">
                        <h3>💳 Wallet</h3>
                        <div class="wallet-balance">${userBalance.toFixed(2)} ETB</div>
                        <input type="number" id="depositAmountInput" class="wallet-input" placeholder="Amount in ETB (e.g. 50)" min="10" step="1">
                        <button type="button" class="btn-deposit" onclick="depositFunds()">Deposit Funds</button>
                        <div class="wallet-status-msg" id="walletStatusMsg"></div>
                    </div>
                `;
                return;
            }
            if (tabName === "history") {
                const rows = verifiedWinnersList.map(w => `• ${w.name} (${w.phone}) — ${w.session}`).join("\n");
                container.innerHTML = `
                    <div class="director-panel">
                        <div class="director-title">📜 Verified Winners History</div>
                        <div class="director-detail-box">${rows}</div>
                        <button type="button" class="director-back-btn" onclick="startSelectionPhase(30)">Back to Game</button>
                    </div>
                `;
                return;
            }
            if (tabName === "director") {
                container.innerHTML = `
                    <div class="director-panel">
                        <div class="director-title">⚙️ Director Panel</div>
                        <div class="director-subtitle">Guder Bingo Controls</div>
                        <button type="button" class="director-row-btn" onclick="startSelectionPhase(30)">Start New Cartela Selection</button>
                        <button type="button" class="director-back-btn" onclick="showGateScreen()">Back to Welcome</button>
                    </div>
                `;
            }
        }

        function depositFunds() {
            const input = document.getElementById("depositAmountInput");
            const statusEl = document.getElementById("walletStatusMsg");
            const balEl = document.querySelector(".wallet-balance");
            const amt = Number(input && input.value ? input.value : 0);
            if (!amt || amt <= 0) {
                if (statusEl) statusEl.textContent = "Please enter a valid amount.";
                return;
            }
            userBalance += amt;
            if (balEl) balEl.textContent = `${userBalance.toFixed(2)} ETB`;
            if (statusEl) statusEl.textContent = `Added ${amt.toFixed(2)} ETB to wallet.`;
            if (input) input.value = "";
        }
    </script>
</body>
</html>
