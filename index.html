<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 10px; }
        .status-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        .audio-banner {
            background-color: #d32f2f;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            width: 100%;
            max-width: 350px;
            cursor: pointer;
        }
        .called-number-box {
            font-size: 2rem;
            font-weight: bold;
            color: #00e676;
            background: #222;
            width: 100%;
            max-width: 350px;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #00e676;
            margin-bottom: 10px;
        }
        .registration-panel {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .registration-panel input {
            padding: 10px;
            font-size: 1.2rem;
            width: 80px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #666;
            background: #2a2a2a;
            color: #fff;
            margin-bottom: 10px;
        }
        .cartela-grid-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 10px;
            background: #111;
            padding: 5px;
            border-radius: 5px;
        }
        .picker-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .picker-btn.selected {
            background-color: #2e7d32 !important;
            border: 1px solid #4caf50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 350px;
            width: 100%;
            margin-bottom: 15px;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell.marked { background-color: #0288d1; border-color: #03a9f4; transform: scale(0.95); }
        .cell.free { background-color: #ff8f00; color: #000; }
        .action-btn {
            background-color: #2e7d32;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌊 ጉደር ቢንጎ (Guder Bingo) 🌊</h2>
    </div>

    <!-- Audio Unlock Banner for Mobile Browsers -->
    <div class="audio-banner" id="audioBanner" onclick="unlockAudio()">
        🔊 ድምጽ ለማብራት እዚህ ይጫኑ (Tap to Enable Voice)
    </div>

    <div class="status-box" id="gameStatus">ምዝገባ በመካሄድ ላይ... (30 ሰከንድ)</div>

    <!-- Cartela Selector (1 to 800) -->
    <div class="registration-panel" id="regPanel">
        <p style="margin-bottom:8px; font-size:0.9rem;">ካርቴላ ቁጥር ይምረጡ (ከ 1 እስከ 800):</p>
        <input type="number" id="cartelaInput" min="1" max="800" value="1">
        <br>
        <button class="action-btn" style="padding:8px 16px; font-size:1rem;" onclick="confirmCartelaSelection()">ካርቴላ ምረጥ (Lock Cartela)</button>
    </div>

    <div class="called-number-box" id="calledDisplay">የተጠራ ቁጥር: --</div>

    <div class="grid" id="bingoBoard" style="display:none;"></div>

    <button class="action-btn" id="bingoBtn" onclick="claimBingo()" disabled>🎉 ቢንጎ! (BINGO)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gameState = "REGISTRATION"; 
        let selectedCartelaNo = 1;
        let audioUnlocked = false;
        let callInterval = null;

        const statusBox = document.getElementById('gameStatus');
        const calledDisplay = document.getElementById('calledDisplay');
        const bingoBtn = document.getElementById('bingoBtn');
        const board = document.getElementById('bingoBoard');
        const regPanel = document.getElementById('regPanel');
        const audioBanner = document.getElementById('audioBanner');

        // --- AUDIO UNLOCK FUNCTION (Fixes Mobile Voice Silence) ---
        function unlockAudio() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("ድምጽ ተከፍቷል");
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
                audioUnlocked = true;
                audioBanner.style.display = "none";
            }
        }

        // --- VOICE ANNOUNCEMENT SYSTEM ---
        function speakVoice(text) {
            if ('speechSynthesisIn' in window || 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function callNumberVoice(num) {
            let letter = num <= 15 ? 'B' : num <= 30 ? 'I' : num <= 45 ? 'N' : num <= 60 ? 'G' : 'O';
            let amharicLetter = num <= 15 ? 'ቢ' : num <= 30 ? 'አይ' : num <= 45 ? 'ኤን' : num <= 60 ? 'ጂ' : 'ኦ';
            
            calledDisplay.textContent = `የተጠራ ቁጥር: ${amharicLetter}-${num}`;
            speakVoice(`${letter} ${num}`);
        }

        // --- CONFIRM CARTELA & HIGHLIGHT GREEN ---
        function confirmCartelaSelection() {
            const inputVal = parseInt(document.getElementById('cartelaInput').value);
            if (isNaN(inputVal) || inputVal < 1 || inputVal > 800) {
                alert("እባክዎ ከ 1 እስከ 800 መካከል ትክክለኛ ቁጥር ያስገቡ።");
                return;
            }
            selectedCartelaNo = inputVal;

            // Hide registration panel, show game board
            regPanel.style.display = "none";
            board.style.display = "grid";
            statusBox.style.backgroundColor = "#2e7d32"; // Highlights green on selection
            statusBox.textContent = `ካርቴላ #${selectedCartelaNo} ተመርጧል (ተቆልፏል)!`;

            generateBoardNumbers();

            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "join_round", cartela_no: selectedCartelaNo }));
            }
        }

        function generateBoardNumbers() {
            board.innerHTML = '';
            const numbers = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5).slice(0, 24);
            let cellIdx = 0;

            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (i === 12) {
                    cell.textContent = "ነጻ";
                    cell.classList.add('free', 'marked');
                } else {
                    cell.textContent = numbers[cellIdx++];
                    cell.addEventListener('click', () => {
                        if (gameState === "CALLING") cell.classList.toggle('marked');
                    });
                }
                board.appendChild(cell);
            }
        }

        // --- 30-SECOND REGISTRATION TIMER ---
        let regTimer = 30;
        const regInterval = setInterval(() => {
            regTimer--;
            if (regPanel.style.display !== "none") {
                statusBox.textContent = `ምዝገባ: ${regTimer} ሰከንድ ቀርቷል`;
            }
            if (regTimer <= 0) {
                clearInterval(regInterval);
                if (regPanel.style.display !== "none") {
                    confirmCartelaSelection(); // Auto-lock default if time runs out
                }
                startPreparationStage();
            }
        }, 1000);

        function startPreparationStage() {
            gameState = "PREPARING";
            statusBox.style.backgroundColor = "#1e1e1e";
            statusBox.textContent = "ዝግጅት ላይ ነው... (Preparing...)";
            let prepTimer = 5;

            const prepInterval = setInterval(() => {
                prepTimer--;
                if (prepTimer <= 0) {
                    clearInterval(prepInterval);
                    startNumberCalling();
                }
            }, 1000);
        }

        function startNumberCalling() {
            gameState = "CALLING";
            bingoBtn.disabled = false;
            statusBox.textContent = `ጨዋታ ተጀምሯል! ካርቴላ #${selectedCartelaNo}`;

            const pool = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let drawIdx = 0;

            callInterval = setInterval(() => {
                if (drawIdx < pool.length && gameState === "CALLING") {
                    const num = pool[drawIdx++];
                    callNumberVoice(num);
                } else {
                    clearInterval(callInterval);
                }
            }, 4000);
        }

        function claimBingo() {
            if (gameState !== "CALLING") return;

            speakVoice("Bingo! Winner!");
            statusBox.textContent = "ቢንጎ አሸናፊነት በመረጋገጥ ላይ...";
            
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "claim_bingo" }));
            }

            clearInterval(callInterval);
            gameState = "DISPLAY";
            
            setTimeout(() => {
                statusBox.textContent = `🏆 አሸናፊ ካርቴላ #${selectedCartelaNo}!`;
                setTimeout(() => {
                    location.reload();
                }, 5000);
            }, 1000);
        }
    </script>
</body>
</html>
