<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #0088cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: #1e1e1e;
            --marked-color: #2ec4b6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 5px; }
        #statusMessage {
            font-size: 0.95rem;
            color: #ffaa00;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 350px;
            width: 100%;
            margin-bottom: 15px;
            display: none; /* Hidden until cartela arrives */
        }
        .cell {
            aspect-ratio: 1;
            background-color: var(--card-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
        }
        .cell.marked {
            background-color: var(--marked-color);
            color: #000;
        }
        .cell.free {
            background-color: #ff2a4b;
            color: #fff;
        }
        .bingo-btn {
            width: 100%;
            max-width: 350px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            display: none; /* Hidden until cartela arrives */
        }
        .menu-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 350px;
            width: 100%;
        }
        .menu-bar button {
            padding: 8px 12px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <h2>🌊 Guder Bingo</h2>
    <div id="statusMessage">⏳ Waiting for your game cartela...</div>

    <div class="grid" id="bingoBoard"></div>

    <button class="bingo-btn" id="bingoBtn" onclick="claimBingo()">BINGO!</button>

    <div class="menu-bar">
        <button onclick="openDeposit()">Deposit</button>
        <button onclick="openWithdraw()">Withdraw</button>
        <button onclick="openSupport()">Support</button>
        <button onclick="openInstructions()">Instructions</button>
        <button onclick="openInvite()">Invite</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Simulate receiving cartela data (can be linked to backend parameters or API later)
        function loadCartela(numbersArray) {
            const board = document.getElementById("bingoBoard");
            const statusMsg = document.getElementById("statusMessage");
            const bingoBtn = document.getElementById("bingoBtn");
            
            board.innerHTML = "";
            let count = 0;

            for(let i = 0; i < 25; i++) {
                const cell = document.createElement("div");
                cell.classList.add("cell");
                if(i === 12) {
                    cell.innerText = "FREE";
                    cell.classList.add("free", "marked");
                } else {
                    cell.innerText = numbersArray[count++] || (Math.floor(Math.random() * 75) + 1);
                    cell.addEventListener("click", () => {
                        cell.classList.toggle("marked");
                    });
                }
                board.appendChild(cell);
            }

            // Reveal board and hide waiting message once cartela is active
            statusMsg.style.display = "none";
            board.style.display = "grid";
            bingoBtn.style.display = "block";
        }

        function claimBingo() {
            if(tg.showAlert) {
                tg.showAlert("🎉 Congratulations! You declared Bingo!");
            } else {
                alert("🎉 Congratulations! You declared Bingo!");
            }
        }

        function openDeposit() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.sendData("DEPOSIT");
            } else {
                alert("Use /deposit in the Telegram bot chat to add funds.");
            }
        }

        function openWithdraw() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.sendData("WITHDRAW");
            } else {
                alert("Use /withdraw in the Telegram bot chat to withdraw funds.");
            }
        }

        function openSupport() {
            window.Telegram.WebApp.openTelegramLink("https://t.me/Guderbingosupport");
        }

        function openInstructions() {
            alert("Game Instructions:\nTap numbers to mark your cartela, get a line, and click BINGO!");
        }

        function openInvite() {
            window.Telegram.WebApp.openTelegramLink("https://t.me/share/url?url=https://t.me/guderbingo_bot&text=Play%20Guder%20Bingo%20now!");
        }

        // Auto-load sample cartela after a brief check (or integrate with your active game round)
        setTimeout(() => {
            let sampleNumbers = [];
            while(sampleNumbers.length < 24) {
                let r = Math.floor(Math.random() * 75) + 1;
                if(!sampleNumbers.includes(r)) sampleNumbers.push(r);
            }
            loadCartela(sampleNumbers);
        }, 1500);
    </script>
</body>
</html>
