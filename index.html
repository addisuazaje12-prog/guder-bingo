<script>
    // Example function to play your GitHub-hosted Amharic voice files
    function playAmharicVoice(fileName) {
        try {
            let audio = new Audio(`https://addisuazaje12-prog.github.io/guder-bingo/${fileName}`);
            audio.play().catch(e => console.log("Audio play error:", e));
        } catch(e) {
            console.log(e);
        }
    }

    // When calling a number (e.g. B-10)
    function callNumberVoice(num) {
        let letter = num <= 15 ? 'b' : num <= 30 ? 'i' : num <= 45 ? 'n' : num <= 60 ? 'g' : 'o';
        // This will play a file named like b10.mp3, o73.mp3, etc. from your repo
        playAmharicVoice(`${letter}${num}.mp3`);
    }

    // When winning
    function claimBingo() {
        // This will play bingo.mp3 from your repo
        playAmharicVoice('bingo.mp3');
    }
</script>
