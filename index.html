<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 8px; }
        .status-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 8px;
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        .audio-banner {
            background-color: #d32f2f;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            width: 100%;
            max-width: 360px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(211,47,47,0.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .called-number-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00e676;
            background: #222;
            width: 100%;
            max-width: 360px;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #00e676;
            margin-bottom: 10px;
        }
        .cartela-selection-board {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 12px;
        }
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            max-height: 220px;
            overflow-y: auto;
            padding: 5px;
            background: #000;
            border-radius: 6px;
        }
        .cartela-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 2px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .cartela-btn.selected {
            background-color: #2e7d32 !important;
            border-color: #4caf50 !important;
            color: #fff !important;
            transform: scale(1.05);
        }
        .board-container {
            width: 100%;
            max-width: 360px;
            margin-bottom: 12px;
        }
        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }
        .bingo-header-cell {
            background-color: #d32f2f;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 900;
            text-align: center;
            padding: 8px 0;
            border-radius: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell.marked { background-color: #0288d1; border-color: #03a9f4; transform: scale(0.95); }
        .cell.free { background-color: #ff8f00; color: #000; }
        
        .action-btn {
            background-color: #2e7d32;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌊 ጉደር ቢንጎ (Guder Bingo) 🌊</h2>
    </div>

    <!-- AUDIO UNLOCK BANNER -->
    <div class="audio-banner" id="audioBanner" onclick="unlockAudio()">
        🔊 ድምጽ ለማብራት እዚህ ይጫኑ (TAP TO UNLOCK AMHARIC VOICE)
    </div>

    <div class="status-box" id="gameStatus">ደረጃ 1፡ ምዝገባ (30 ሰከንድ)</div>

    <div class="cartela-selection-board" id="cartelaBoard">
        <p style="text-align:center; margin-bottom:8px; font-size:0.9rem; color:#aaa;">
            ካርቴላዎን በፍጥነት ይምረጡ (ከ 1 እስከ 800):
        </p>
        <div class="cartela-grid" id="cartelaGrid"></div>
    </div>

    <div class="called-number-box" id="calledDisplay">የተጠራ ቁጥር: --</div>

    <div class="board-container" id="boardContainer" style="display:none;">
        <div class="bingo-header-row">
            <div class="bingo-header-cell">B</div>
            <div class="bingo-header-cell">I</div>
            <div class="bingo-header-cell">N</div>
            <div class="bingo-header-cell">G</div>
            <div class="bingo-header-cell">O</div>
        </div>
        <div class="grid" id="bingoBoard"></div>
    </div>

    <button class="action-btn" id="bingoBtn" onclick="claimBingo()" disabled>🎉 ቢንጎ! (BINGO)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gameState = "REGISTRATION";
        let selectedCartelaNo = null;
        let callInterval = null;
        
        // Single persistent Audio Element for WebView compatibility
        const voiceAudio = new Audio();
        let audioUnlocked = false;

        const statusBox = document.getElementById('gameStatus');
        const calledDisplay = document.getElementById('calledDisplay');
        const bingoBtn = document.getElementById('bingoBtn');
        const boardContainer = document.getElementById('boardContainer');
        const bingoBoard = document.getElementById('bingoBoard');
        const cartelaBoard = document.getElementById('cartelaBoard');
        const cartelaGrid = document.getElementById('cartelaGrid');
        const audioBanner = document.getElementById('audioBanner');

        // AMHARIC NUMBER MAPPING FOR DISPLAY
        function getAmharicLetter(num) {
            return num <= 15 ? 'ቢ' : num <= 30 ? 'አይ' : num <= 45 ? 'ኤን' : num <= 60 ? 'ጂ' : 'ኦ';
        }

        function getFilePrefix(num) {
            return num <= 15 ? 'b' : num <= 30 ? 'i' : num <= 45 ? 'n' : num <= 60 ? 'g' : 'o';
        }

        // PLAY MP3 FROM GITHUB REPOSITORY
        function playAmharicMP3(filename) {
            try {
                voiceAudio.pause();
                voiceAudio.currentTime = 0;
                voiceAudio.src = `./${filename}`;
                
                const playPromise = voiceAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Audio playback blocked by Telegram WebView:", error);
                    });
                }
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        function unlockAudio() {
            audioUnlocked = true;
            // Unlocks audio context on mobile iOS/Android Telegram WebViews
            voiceAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
            voiceAudio.play().then(() => {
                audioBanner.style.backgroundColor = "#2e7d32";
                audioBanner.style.color = "#fff";
                audioBanner.style.animation = "none";
                audioBanner.textContent = "🔊 ድምጽ ተከፍቷል (Amharic Voice Active!)";
                setTimeout(() => { audioBanner.style.display = "none"; }, 1500);
            }).catch(() => {
                audioBanner.textContent = "⚠️ ድጋሚ ይጫኑ (TAP AGAIN TO UNLOCK)";
            });
        }

        function callNumberVoice(num) {
            let letter = getAmharicLetter(num);
            let prefix = getFilePrefix(num);
            
            calledDisplay.textContent = `የተጠራ ቁጥር: ${letter}-${num}`;
            
            // Plays b10.mp3, o73.mp3, etc. from root directory
            playAmharicMP3(`${prefix}${num}.mp3`);
        }

        // POPULATE 800 CARTELA GRID
        for (let i = 1; i <= 800; i++) {
            const btn = document.createElement('button');
            btn.classList.add('cartela-btn');
            btn.textContent = i;
            btn.onclick = () => selectCartela(i, btn);
            cartelaGrid.appendChild(btn);
        }

        function selectCartela(cartelaNum, btnElement) {
            if (gameState !== "REGISTRATION") return;

            document.querySelectorAll('.cartela-btn.selected').forEach(el => el.classList.remove('selected'));
            btnElement.classList.add('selected');
            selectedCartelaNo = cartelaNum;

            statusBox.style.backgroundColor = "#2e7d32";
            statusBox.textContent = `ካርቴላ #${selectedCartelaNo} ተመርጧል!`;

            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "join_round", cartela_no: selectedCartelaNo }));
            }
        }

        // 30-SECOND COUNTDOWN
        let regTimer = 30;
        const regInterval = setInterval(() => {
            regTimer--;
            if (gameState === "REGISTRATION") {
                statusBox.textContent = `ምዝገባ: ${regTimer} ሰከንድ ቀርቷል ${selectedCartelaNo ? '(ካርቴላ #' + selectedCartelaNo + ')' : ''}`;
            }

            if (regTimer <= 0) {
                clearInterval(regInterval);
                if (!selectedCartelaNo) {
                    selectedCartelaNo = Math.floor(Math.random() * 800) + 1;
                }

                cartelaBoard.style.display = "none";
                boardContainer.style.display = "block";
                generateBoardNumbers();
                startPreparationStage();
            }
        }, 1000);

        function generateBoardNumbers() {
            bingoBoard.innerHTML = '';
            
            const bCol = Array.from({length: 15}, (_, i) => i + 1).sort(() => Math.random() - 0.5).slice(0, 5);
            const iCol = Array.from({length: 15}, (_, i) => i + 16).sort(() => Math.random() - 0.5).slice(0, 5);
            const nCol = Array.from({length: 15}, (_, i) => i + 31).sort(() => Math.random() - 0.5).slice(0, 4);
            const gCol = Array.from({length: 15}, (_, i) => i + 46).sort(() => Math.random() - 0.5).slice(0, 5);
            const oCol = Array.from({length: 15}, (_, i) => i + 61).sort(() => Math.random() - 0.5).slice(0, 5);

            for (let row = 0; row < 5; row++) {
                createCell(bCol[row]);
                createCell(iCol[row]);
                if (row === 2) {
                    const freeCell = document.createElement('div');
                    freeCell.classList.add('cell', 'free', 'marked');
                    freeCell.textContent = "ነጻ";
                    bingoBoard.appendChild(freeCell);
                } else {
                    const nIdx = row > 2 ? row - 1 : row;
                    createCell(nCol[nIdx]);
                }
                createCell(gCol[row]);
                createCell(oCol[row]);
            }
        }

        function createCell(numVal) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.textContent = numVal;
            cell.addEventListener('click', () => {
                if (gameState === "CALLING") cell.classList.toggle('marked');
            });
            bingoBoard.appendChild(cell);
        }

        function startPreparationStage() {
            gameState = "PREPARING";
            statusBox.style.backgroundColor = "#1e1e1e";
            statusBox.textContent = "ዝግጅት ላይ ነው... (5 ሰከንድ)";
            let prepTimer = 5;

            const prepInterval = setInterval(() => {
                prepTimer--;
                if (prepTimer <= 0) {
                    clearInterval(prepInterval);
                    startNumberCalling();
                }
            }, 1000);
        }

        function startNumberCalling() {
            gameState = "CALLING";
            bingoBtn.disabled = false;
            statusBox.textContent = `ጨዋታ ተጀምሯል! ካርቴላ #${selectedCartelaNo}`;

            const pool = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let drawIdx = 0;

            callInterval = setInterval(() => {
                if (drawIdx < pool.length && gameState === "CALLING") {
                    const num = pool[drawIdx++];
                    callNumberVoice(num);
                } else {
                    clearInterval(callInterval);
                }
            }, 4000);
        }

        // LOUD WINNER ANNOUNCEMENT
        function claimBingo() {
            if (gameState !== "CALLING") return;

            // Plays bingo.mp3 from repository
            playAmharicMP3('bingo.mp3');

            statusBox.textContent = "ቢንጎ አሸናፊነት በመረጋገጥ ላይ...";

            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "claim_bingo" }));
            }

            clearInterval(callInterval);
            gameState = "DISPLAY";

            setTimeout(() => {
                statusBox.textContent = `🏆 አሸናፊ ካርቴላ #${selectedCartelaNo}!`;
                setTimeout(() => {
                    location.reload();
                }, 5000);
            }, 1000);
        }
    </script>
</body>
</html>
