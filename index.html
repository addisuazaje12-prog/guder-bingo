<script>
(() => {
"use strict";

const tg = window.Telegram && window.Telegram.WebApp
  ? window.Telegram.WebApp : null;

if (tg) {
  tg.ready();
  tg.expand();
}

const API = "https://guder-bingo-server.onrender.com";
const initData = tg && tg.initData ? tg.initData : "";

let currentRoom = null;
let currentCartela = null;
let currentMatrix = null;
let lastSpokenNumber = null;

const $ = id => document.getElementById(id);

function toast(message) {
  const el = $("toast");
  if (!el) return;
  el.textContent = message;
  el.style.display = "block";

  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => {
    el.style.display = "none";
  }, 4000);
}

function setStatus(message, error = false) {
  const statusEl = $("statusMessage");
  if (statusEl) {
    statusEl.textContent = message;
    statusEl.style.background = error ? "#49252b" : "#332b19";
  }
}

function headers() {
  return {
    "Content-Type": "application/json",
    "X-Telegram-Init-Data": initData
  };
}

async function api(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: {
      ...headers(),
      ...(options.headers || {})
    }
  });

  let data;
  try {
    data = await response.json();
  } catch (e) {
    throw new Error("The server returned an unreadable response.");
  }

  if (!response.ok) {
    throw new Error(data.message || "Request failed.");
  }

  return data;
}

window.showSection = function(id) {
  try {
    [
      "gameSection",
      "depositSection",
      "walletSection",
      "historySection",
      "helpSection"
    ].forEach(section => {
      const el = $(section);
      if (el) {
        if (section === id) {
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      }
    });

    if (id === "walletSection") refreshWallet();
    if (id === "historySection") loadHistory();
    if (id === "gameSection") refreshGame();
    if (id === "depositSection") loadConfig();
  } catch (err) {
    console.error("Error switching section:", err);
  }
};

window.refreshWallet = async function() {
  try {
    const data = await api("/api/wallet");
    const balanceEl = $("balance");
    if (balanceEl) {
      balanceEl.textContent = Number(data.balance).toFixed(2) + " ETB";
    }

    const txEl = $("walletTransactions");
    if (txEl) {
      txEl.innerHTML = data.transactions && data.transactions.length
        ? data.transactions.map(t => `
          <div class="item">
            <b>${escapeHtml(t.txn_type)}</b> · ${Number(t.amount).toFixed(2)} ETB<br>
            <span class="muted">${escapeHtml(t.created_at)}</span>
          </div>
        `).join("")
        : "No wallet transactions yet.";
    }
  } catch (e) {
    setStatus(e.message, true);
  }
};

async function loadConfig() {
  try {
    const config = await api("/api/config");
    const phone = config.telebirr_phone || "0913706670";
    const detailsEl = $("paymentDetails");
    if (detailsEl) {
      detailsEl.innerHTML = `
        <b>Telebirr payment number:</b> ${escapeHtml(phone)}<br>
        <span class="muted">Minimum deposit is 10.00 ETB. Submit your SMS receipt reference after transferring.</span>
      `;
    }
  } catch (e) {
    const detailsEl = $("paymentDetails");
    if (detailsEl) detailsEl.textContent = e.message;
  }
}

window.submitDeposit = async function(event) {
  event.preventDefault();
  const button = $("depositSubmit");
  if (button) button.disabled = true;

  const resultEl = $("depositResult");
  if (resultEl) resultEl.textContent = "Submitting receipt...";

  try {
    const data = await api("/api/deposit", {
      method: "POST",
      body: JSON.stringify({
        payment_method: $("paymentMethod").value,
        amount: Number($("depositAmount").value),
        payer_reference: $("payerReference").value.trim(),
        receipt_text: $("receiptText").value.trim()
      })
    });

    if (resultEl) resultEl.textContent = data.message + " Deposit reference: " + data.deposit_id;
    const formEl = $("depositForm");
    if (formEl) formEl.reset();

    toast("Receipt submitted for review.");
    refreshWallet();
  } catch (e) {
    if (resultEl) resultEl.textContent = e.message;
    toast(e.message);
  } finally {
    if (button) button.disabled = false;
  }
};

async function refreshGame() {
  try {
    const data = await api("/api/game/state");

    const balanceEl = $("balance");
    if (balanceEl) {
      balanceEl.textContent = Number(data.balance || 0).toFixed(2) + " ETB";
    }

    currentRoom = data.room;
    currentCartela = data.cartela;

    const roomInfo = $("roomInfo");
    const selectionArea = $("selectionArea");
    const cardArea = $("cardArea");

    if (!currentRoom) {
      if (roomInfo) roomInfo.textContent = "There is no active game room at the moment.";
      if (selectionArea) selectionArea.classList.add("hidden");
      if (cardArea) cardArea.classList.add("hidden");
      return;
    }

    if (roomInfo) {
      roomInfo.textContent = `Room #${currentRoom.room_id} · Status: ${currentRoom.status} · Pot: ${currentRoom.total_pot} ETB`;
    }

    if (currentCartela) {
      currentMatrix = JSON.parse(currentCartela.numbers_json);
      if (selectionArea) selectionArea.classList.add("hidden");
      if (cardArea) cardArea.classList.remove("hidden");

      const cardLabel = $("myCardLabel");
      if (cardLabel) cardLabel.textContent = "Your cartela: #" + currentCartela.cartela_no;

      renderCard(data.called_numbers || []);
    } else {
      if (cardArea) cardArea.classList.remove("hidden");
      const canSelect = ["OPEN", "REGISTRATION"].includes(currentRoom.status) && Number(data.balance) >= 10;
      if (selectionArea) selectionArea.classList.toggle("hidden", !canSelect);

      if (Number(data.balance) < 10 && roomInfo) {
        roomInfo.innerHTML += `<br><span style="color: #ffd77b;">👀 Spectator Mode: Deposit 10 ETB to select a cartela and play!</span>`;
      }
      renderCard(data.called_numbers || []);
    }
  } catch (e) {
    setStatus(e.message, true);
  }
}

function makeCard() {
  const cols = [
    randomUnique(1, 15, 5),
    randomUnique(16, 30, 5),
    randomUnique(31, 45, 5),
    randomUnique(46, 60, 5),
    randomUnique(61, 75, 5)
  ];

  return Array.from({length: 5}, (_, r) =>
    cols.map((col, c) => r === 2 && c === 2 ? "FREE" : col[r])
  );
}

function randomUnique(min, max, count) {
  const values = [];
  while (values.length < count) {
    const n = Math.floor(Math.random() * (max - min + 1)) + min;
    if (!values.includes(n)) values.push(n);
  }
  return values;
}

window.selectCartela = async function() {
  if (!currentRoom) return;
  const button = $("selectBtn");
  if (button) button.disabled = true;

  try {
    const cartelaInput = $("cartelaNo");
    const cartelaNo = Number(cartelaInput ? cartelaInput.value : 1);

    if (!Number.isInteger(cartelaNo) || cartelaNo < 1 || cartelaNo > 800) {
      throw new Error("Enter a cartela number from 1 to 800.");
    }

    const matrix = makeCard();
    const data = await api("/api/cartela/select", {
      method: "POST",
      body: JSON.stringify({
        room_id: currentRoom.room_id,
        cartela_no: cartelaNo,
        numbers: matrix
      })
    });

    currentMatrix = matrix;
    currentCartela = { cartela_no: cartelaNo, numbers_json: JSON.stringify(matrix) };

    const cardLabel = $("myCardLabel");
    if (cardLabel) cardLabel.textContent = "Your cartela: #" + cartelaNo;

    const selectionArea = $("selectionArea");
    const cardArea = $("cardArea");
    if (selectionArea) selectionArea.classList.add("hidden");
    if (cardArea) cardArea.classList.remove("hidden");

    renderCard([]);
    toast(data.message || "Cartela selected.");
    refreshGame();
  } catch (e) {
    toast(e.message);
  } finally {
    if (button) button.disabled = false;
  }
};

function renderCard(calls) {
  if (!currentMatrix) return;

  const called = new Set((calls || []).map(c => Number(c.number)));
  const board = $("bingoBoard");
  if (!board) return;

  board.innerHTML = "";

  currentMatrix.forEach(row => {
    row.forEach(value => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = value;

      if (String(value).toUpperCase() === "FREE") {
        cell.classList.add("free", "marked");
      } else if (called.has(Number(value))) {
        cell.classList.add("marked");
      }
      board.appendChild(cell);
    });
  });

  const latest = calls && calls.length ? Number(calls[calls.length - 1].number) : null;
  const latestCallEl = $("latestCall");
  if (latestCallEl) {
    latestCallEl.textContent = latest ? letterFor(latest) + " - " + latest : "Waiting for the first call";
  }

  const recentCallsEl = $("recentCalls");
  if (recentCallsEl) {
    recentCallsEl.innerHTML = (calls || []).slice(-10).reverse().map(c =>
      `<span>${letterFor(Number(c.number))}-${Number(c.number)}</span>`
    ).join("");
  }

  if (latest && latest !== lastSpokenNumber) {
    lastSpokenNumber = latest;
    speakAmharicNumber(latest);
  }
}

function letterFor(n) {
  if (n <= 15) return "B";
  if (n <= 30) return "I";
  if (n <= 45) return "N";
  if (n <= 60) return "G";
  return "O";
}

function speakAmharicNumber(n) {
  if ('speechSynthesis' in window) {
    const letter = letterFor(n);
    const text = `ቁጥር ${letter} ${n}`;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'am-ET';
    window.speechSynthesis.speak(utterance);
  }
}

function showBingoCelebrationModal() {
  const modal = $("bingoModal");
  const countdownEl = $("modalCountdown");
  let timeLeft = 5;

  if (modal) modal.classList.remove("hidden");
  if (countdownEl) countdownEl.textContent = timeLeft;

  const timer = setInterval(() => {
    timeLeft--;
    if (countdownEl) countdownEl.textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (modal) modal.classList.add("hidden");
    }
  }, 1000);
}

window.claimBingo = async function() {
  if (!currentRoom || !currentCartela) return;
  const btn = $("bingoBtn");
  if (btn) btn.disabled = true;

  try {
    const data = await api("/api/claim-bingo", {
      method: "POST",
      body: JSON.stringify({
        room_id: currentRoom.room_id,
        cartela_no: currentCartela.cartela_no
      })
    });

    if (data.status === "winner") {
      setStatus("🎉 BINGO VERIFIED!");
      showBingoCelebrationModal();
      toast("Bingo verified by the server!");
    } else {
      toast(data.message || "Bingo was not verified.");
    }
  } catch (e) {
    toast(e.message);
  } finally {
    if (btn) btn.disabled = false;
    await refreshGame();
  }
};

async function loadHistory() {
  try {
    const data = await api("/api/game/history");
    const historyEl = $("gameHistory");
    if (historyEl) {
      historyEl.innerHTML = data.history && data.history.length
        ? data.history.map(x => `
          <div class="item">
            Room #${x.room_id} · Cartela #${x.cartela_no}<br>
            <span class="muted">${escapeHtml(x.created_at)}</span>
          </div>
        `).join("")
        : "No completed games yet.";
    }
  } catch (e) {
    const historyEl = $("gameHistory");
    if (historyEl) historyEl.textContent = e.message;
  }
}

window.inviteFriends = function() {
  const url = "https://t.me/guderbingo_bot";
  const share = "https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent("Join me on Guder Bingo!");
  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(share);
  } else {
    window.open(share, "_blank");
  }
};

window.openSupport = function() {
  const url = "https://t.me/Guderbingosupport";
  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(url);
  } else {
    window.open(url, "_blank");
  }
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

async function init() {
  if (!tg || !initData) {
    setStatus("Connected in test mode.", false);
  } else {
    setStatus("Connected securely to Guder Bingo.", false);
  }

  await loadConfig();
  await refreshWallet();
  await refreshGame();

  setInterval(refreshGame, 3000);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    refreshGame();
  }
});

init();

})();
</script>
