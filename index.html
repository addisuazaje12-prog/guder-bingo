<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #0088cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: #1e1e1e;
            --marked-color: #2ec4b6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 5px; }
        #statusMessage {
            font-size: 0.95rem;
            color: #ffaa00;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }
        .cartela-selector {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 350px;
        }
        .cartela-selector input {
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            width: 120px;
            text-align: center;
        }
        .cartela-selector button {
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 350px;
            width: 100%;
            margin-bottom: 6px;
            display: none;
        }
        .bingo-header .letter {
            aspect-ratio: 1;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            user-select: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 350px;
            width: 100%;
            margin-bottom: 15px;
            display: none;
        }
        .cell {
            aspect-ratio: 1;
            background-color: var(--card-bg);
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
        }
        .cell.marked {
            background-color: var(--marked-color);
            color: #000;
        }
        .cell.free {
            background-color: #ff2a4b;
            color: #fff;
        }
        .bingo-btn {
            width: 100%;
            max-width: 350px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            display: none;
        }
        .menu-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 350px;
            width: 100%;
        }
        .menu-bar button {
            padding: 8px 12px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <h2>🌊 Guder Bingo</h2>
    <div id="statusMessage">Select your Cartela (1 - 800) to join the round:</div>

    <div class="cartela-selector" id="selectorDiv">
        <input type="number" id="cartelaInput" min="1" max="800" placeholder="Cartela #">
        <button onclick="selectCartela()">Join Round</button>
    </div>

    <!-- B-I-N-G-O Column Headers -->
    <div class="bingo-header" id="bingoHeader">
        <div class="letter">B</div>
        <div class="letter">I</div>
        <div class="letter">N</div>
        <div class="letter">G</div>
        <div class="letter">O</div>
    </div>

    <!-- Number Grid -->
    <div class="grid" id="bingoBoard"></div>

    <button class="bingo-btn" id="bingoBtn" onclick="claimBingo()">BINGO!</button>

    <div class="menu-bar">
        <button onclick="openDeposit()">Deposit</button>
        <button onclick="openWithdraw()">Withdraw</button>
        <button onclick="openSupport()">Support</button>
        <button onclick="openInstructions()">Instructions</button>
        <button onclick="openInvite()">Invite</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function selectCartela() {
            const input = document.getElementById("cartelaInput");
            const cartelaNo = parseInt(input.value);
            if (!cartelaNo || cartelaNo < 1 || cartelaNo > 800) {
                alert("Please enter a valid Cartela number between 1 and 800.");
                return;
            }

            // Send selection data back to Python bot.py backend
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "join_round", cartela_no: cartelaNo }));
            }

            loadBoard(cartelaNo);
        }

        function loadBoard(cartelaNo) {
            document.getElementById("selectorDiv").style.display = "none";
            document.getElementById("statusMessage").innerText = `Active Cartela #${cartelaNo}`;
            document.getElementById("bingoHeader").style.display = "grid";
            const board = document.getElementById("bingoBoard");
            board.style.display = "grid";
            document.getElementById("bingoBtn").style.display = "block";

            board.innerHTML = "";
            
            // Seed-based random generation for consistent cartela layout (1 to 800)
            let numbers = [];
            let seed = cartelaNo * 31;
            function pseudoRandom() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }

            while(numbers.length < 24) {
                let r = Math.floor(pseudoRandom() * 75) + 1;
                if(numbers.indexOf(r) === -1) numbers.push(r);
            }
            
            let count = 0;
            for(let i = 0; i < 25; i++) {
                const cell = document.createElement("div");
                cell.classList.add("cell");
                if(i === 12) {
                    cell.innerText = "FREE";
                    cell.classList.add("free", "marked");
                } else {
                    cell.innerText = numbers[count++];
                    cell.addEventListener("click", () => {
                        cell.classList.toggle("marked");
                    });
                }
                board.appendChild(cell);
            }
        }

        function claimBingo() {
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "claim_bingo" }));
            }
            if(tg.showAlert) {
                tg.showAlert("🎉 Congratulations! Bingo claim submitted!");
            } else {
                alert("🎉 Congratulations! Bingo claim submitted!");
            }
        }

        function openDeposit() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.sendData(JSON.stringify({ action: "deposit" }));
            } else {
                alert("Use /deposit in the Telegram bot chat to add funds.");
            }
        }

        function openWithdraw() {
            alert("Use /withdraw in the Telegram bot chat to withdraw funds.");
        }

        function openSupport() {
            window.Telegram.WebApp.openTelegramLink("https://t.me/Guderbingosupport");
        }

        function openInstructions() {
            alert("Game Instructions:\n1. Choose your Cartela (1 - 800).\n2. Tap numbers as they are called.\n3. Get a full line and click BINGO!");
        }

        function openInvite() {
            window.Telegram.WebApp.openTelegramLink("https://t.me/share/url?url=https://t.me/guderbingo_bot&text=Play%20Guder%20Bingo%20now!");
        }
    </script>
</body>
</html>
