<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 10px; }
        .status-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        .called-number-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00e676;
            background: #222;
            width: 100%;
            max-width: 350px;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #00e676;
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 350px;
            width: 100%;
            margin-bottom: 15px;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell.selected-cartela { background-color: #2e7d32; border-color: #4caf50; }
        .cell.marked { background-color: #0288d1; border-color: #03a9f4; transform: scale(0.95); }
        .cell.free { background-color: #ff8f00; color: #000; }
        .action-btn {
            background-color: #2e7d32;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌊 ጉደር ቢንጎ (Guder Bingo) 🌊</h2>
    </div>

    <div class="status-box" id="gameStatus">ደረጃ 1፡ ምዝገባ (30 ሰከንድ)</div>

    <div class="called-number-box" id="calledDisplay">የተጠራ ቁጥር: --</div>

    <div class="grid" id="bingoBoard"></div>

    <button class="action-btn" id="bingoBtn" onclick="claimBingo()" disabled>🎉 ቢንጎ! (BINGO)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gameState = "REGISTRATION"; // REGISTRATION, PREPARING, CALLING, DISPLAY
        let assignedCartelaNo = Math.floor(Math.random() * 800) + 1;
        let drawnNumbers = [];
        let callInterval = null;

        const statusBox = document.getElementById('gameStatus');
        const calledDisplay = document.getElementById('calledDisplay');
        const bingoBtn = document.getElementById('bingoBtn');
        const board = document.getElementById('bingoBoard');

        // --- AMHARIC VOICE CALLOUT SYSTEM ---
        function speakAmharic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Prevent overlap
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'am-ET';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function callNumberAmharic(num) {
            let letter = num <= 15 ? 'ቢ' : num <= 30 ? 'አይ' : num <= 45 ? 'ኤን' : num <= 60 ? 'ጂ' : 'ኦ';
            calledDisplay.textContent = `የተጠራ ቁጥር: ${letter}-${num}`;
            speakAmharic(`${letter} ${num}`);
        }

        // --- BOARD SETUP ---
        const numbers = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5).slice(0, 24);
        let cellIdx = 0;

        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            if (i === 12) {
                cell.textContent = "ነጻ";
                cell.classList.add('free', 'marked');
            } else {
                cell.textContent = numbers[cellIdx++];
                cell.addEventListener('click', () => {
                    if (gameState === "CALLING") cell.classList.toggle('marked');
                });
            }
            board.appendChild(cell);
        }

        // --- AUTOMATIC GAME CYCLE (STAGES 1-6) ---
        let registrationTimer = 30;

        function startRegistrationCountdown() {
            gameState = "REGISTRATION";
            bingoBtn.disabled = true;
            statusBox.textContent = `ምዝገባ: ${registrationTimer} ሰከንድ (ካርቴላ #${assignedCartelaNo})`;

            // Register card with backend
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "join_round", cartela_no: assignedCartelaNo }));
            }

            const regInterval = setInterval(() => {
                registrationTimer--;
                statusBox.textContent = `ምዝገባ: ${registrationTimer} ሰከንድ (ካርቴላ #${assignedCartelaNo})`;
                
                if (registrationTimer <= 0) {
                    clearInterval(regInterval);
                    startPreparationStage();
                }
            }, 1000);
        }

        function startPreparationStage() {
            gameState = "PREPARING";
            statusBox.textContent = "ዝግጅት ላይ ነው... (5 ሰከንድ)";
            let prepTimer = 5;

            const prepInterval = setInterval(() => {
                prepTimer--;
                if (prepTimer <= 0) {
                    clearInterval(prepInterval);
                    startNumberCalling();
                }
            }, 1000);
        }

        function startNumberCalling() {
            gameState = "CALLING";
            bingoBtn.disabled = false;
            statusBox.textContent = "ጨዋታው ተጀምሯል! ቁጥሮችን ይመልከቱ";

            const pool = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let drawIdx = 0;

            callInterval = setInterval(() => {
                if (drawIdx < pool.length && gameState === "CALLING") {
                    const num = pool[drawIdx++];
                    drawnNumbers.push(num);
                    callNumberAmharic(num);
                } else {
                    clearInterval(callInterval);
                }
            }, 4000);
        }

        function claimBingo() {
            if (gameState !== "CALLING") return;

            // Announce Winner in Voice
            speakAmharic("ቢንጎ! እንኳን ደስ አለዎት! አሸናፊ ሆነዋል!");
            
            statusBox.textContent = "ቢንጎ አሸናፊነት በመረጋገጥ ላይ...";
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "claim_bingo" }));
            }

            // Display Winner for 5 seconds (Stage 5)
            clearInterval(callInterval);
            gameState = "DISPLAY";
            
            setTimeout(() => {
                statusBox.textContent = `🏆 አሸናፊ 카ርቴላ #${assignedCartelaNo}!`;
                setTimeout(() => {
                    // Stage 6: Reset for next round
                    location.reload();
                }, 5000);
            }, 1000);
        }

        // Initialize Registration Stage on Load
        startRegistrationCountdown();
    </script>
</body>
</html>
