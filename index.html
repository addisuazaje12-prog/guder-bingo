<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #2b1f3d;
            --text-color: #ffffff;
            --button-color: #7b2cbf;
            --card-bg: #4a3b6c;
            --marked-color: #2ec4b6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }
        .top-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            width: 100%;
            max-width: 400px;
            background: #4a3b6c;
            padding: 5px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.7rem;
        }
        .top-stats div span {
            display: block;
            font-weight: bold;
            font-size: 0.75rem;
            color: #ffaa00;
        }
        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            overflow-y: auto;
        }
        .timer-box {
            background: #d90429;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
            text-align: center;
        }
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            max-height: 260px;
            overflow-y: auto;
            width: 100%;
            margin-bottom: 10px;
            padding: 4px;
        }
        .cartela-opt {
            aspect-ratio: 1;
            background-color: #f77f00;
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            cursor: pointer;
        }
        .cartela-opt.selected {
            background-color: #2ec4b6 !important;
            color: #000;
        }
        
        /* Explicitly visible Playing Cartela with Red B-I-N-G-O Header */
        .bingo-card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #3c2a59;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            width: 280px;
        }
        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 6px;
        }
        .bingo-letter {
            aspect-ratio: 1;
            background-color: #d90429; /* Explicit Bright Red */
            color: #ffffff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .single-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }
        .cell {
            aspect-ratio: 1;
            background-color: var(--card-bg);
            color: #ffffff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .cell.marked { background-color: var(--marked-color); color: #000; }
        .cell.free { background-color: #ff2a4b; color: #fff; }
        
        .insufficient-box {
            color: #ff4d4d;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            background: rgba(255,0,0,0.1);
            border-radius: 8px;
            width: 85%;
            font-size: 0.9rem;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            background: #1c1427;
            padding: 8px 0;
            border-radius: 10px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 2px;
        }
        .game-footer-actions {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 400px;
        }
        .game-footer-actions button {
            flex: 1;
            padding: 10px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-leave { background-color: #d90429; color: #fff; }
        .btn-refresh { background-color: #0077b6; color: #fff; }
        .btn-bingo { background-color: #ffb703; color: #000; }
        .current-call-display {
            background: #7b2cbf;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- Top Stats -->
    <div class="top-stats" id="topStats" style="display:none;">
        <div>Game ID<span>1_57EP7CEM</span></div>
        <div>Derash<span id="derashVal">4208</span></div>
        <div>Players<span id="playerVal">526</span></div>
        <div>Stake<span>10</span></div>
        <div>Called<span id="calledVal">0</span></div>
    </div>

    <div class="main-container" id="mainContainer">
        <!-- Dynamic Content -->
    </div>

    <!-- Bottom Navigation / Actions -->
    <div id="bottomNavContainer">
        <div class="bottom-nav">
            <button class="nav-btn" onclick="switchTab('game')">🎮 Game</button>
            <button class="nav-btn" onclick="switchTab('history')">📜 History</button>
            <button class="nav-btn" onclick="switchTab('wallet')">💳 Wallet</button>
            <button class="nav-btn" onclick="switchTab('profile')">👤 Profile</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userBalance = 15.0; 
        let registrationTimer = 30;
        let prepTimer = 5;
        let callInterval = null;
        let currentCalledNumber = "-";

        function speakAmharic(text) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'am-ET'; // Amharic speech synthesis
                window.speechSynthesis.speak(utterance);
            }
        }

        function initApp() {
            renderSelectionBoard();
        }

        function renderSelectionBoard() {
            if(callInterval) clearInterval(callInterval);
            document.getElementById("topStats").style.display = "none";
            document.getElementById("bottomNavContainer").innerHTML = `
                <div class="bottom-nav">
                    <button class="nav-btn" onclick="switchTab('game')">🎮 Game</button>
                    <button class="nav-btn" onclick="switchTab('history')">📜 History</button>
                    <button class="nav-btn" onclick="switchTab('wallet')">💳 Wallet</button>
                    <button class="nav-btn" onclick="switchTab('profile')">👤 Profile</button>
                </div>
            `;

            const container = document.getElementById("mainContainer");
            if (userBalance < 10.0) {
                container.innerHTML = `<div class="insufficient-box">Insufficient amount<br><small>እባክዎ በ /deposit በኩል ገንዘብ ያስገቡ</small></div>`;
                return;
            }

            registrationTimer = 30;
            let html = `
                <div class="timer-box" id="regTimerBox">⏱️ Registration Window: 30s</div>
                <div style="margin-bottom:6px; font-size:0.8rem;">ከ1-800 ካርቴላ ይምረጡ (Select Cartela):</div>
                <div class="cartela-grid" id="cartelaGrid">
            `;
            for(let i=1; i<=800; i++) {
                html += `<div class="cartela-opt" id="cart-${i}" onclick="selectAndJoin(${i})">${i}</div>`;
            }
            html += `</div>`;
            container.innerHTML = html;

            // 30 Seconds Registration Countdown
            let countdown = setInterval(() => {
                registrationTimer--;
                let timerBox = document.getElementById("regTimerBox");
                if(timerBox) timerBox.innerText = `⏱️ Registration Window: ${registrationTimer}s`;
                if(registrationTimer <= 0) {
                    clearInterval(countdown);
                    speakAmharic("ምዝገባው ተጠናቋል ጨዋታው ይጀምራል");
                }
            }, 1000);
        }

        function selectAndJoin(cartelaNo) {
            if (userBalance < 10.0) {
                alert("Insufficient amount");
                return;
            }

            let el = document.getElementById(`cart-${cartelaNo}`);
            if(el) el.classList.add("selected");

            speakAmharic(`ካርቴላ ቁጥር ${cartelaNo} ተመርጧል`);

            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "join_round", cartela_no: cartelaNo }));
            }

            // Start 5 Seconds Preparation Screen
            showPreparationScreen(cartelaNo);
        }

        function showPreparationScreen(cartelaNo) {
            prepTimer = 5;
            const container = document.getElementById("mainContainer");
            container.innerHTML = `
                <div class="timer-box" style="background:#ffb703; color:#000;" id="prepTimerBox">🎲 Preparing Game: 5s</div>
                <div style="font-size:0.9rem; color:#2ec4b6;">Cartela #${cartelaNo} Locked. Starting soon...</div>
            `;
            speakAmharic("ጨዋታው ሊጀመር ነው እባክዎ ይጠብቁ");

            let prepInterval = setInterval(() => {
                prepTimer--;
                let pBox = document.getElementById("prepTimerBox");
                if(pBox) pBox.innerText = `🎲 Preparing Game: ${prepTimer}s`;
                if(prepTimer <= 0) {
                    clearInterval(prepInterval);
                    renderCallingBoard(cartelaNo);
                }
            }, 1000);
        }

        function renderCallingBoard(cartelaNo) {
            document.getElementById("topStats").style.display = "grid";
            document.getElementById("bottomNavContainer").innerHTML = `
                <div class="game-footer-actions">
                    <button class="btn-leave" onclick="renderSelectionBoard()">Leave</button>
                    <button class="btn-refresh" onclick="window.location.reload()">Refresh</button>
                    <button class="btn-bingo" onclick="claimBingo()">Bingo!</button>
                </div>
            `;

            const container = document.getElementById("mainContainer");
            
            let cardHtml = `
                <div class="current-call-display" id="currentCallBox">Current Call: -</div>
                <div style="font-size:0.8rem; color:#ffb703; margin-bottom:4px;">ተጫዋች ካርቴላ #${cartelaNo}</div>
                <div class="bingo-card-container">
                    <!-- Bright Red B-I-N-G-O Headers -->
                    <div class="bingo-header-row">
                        <div class="bingo-letter">B</div>
                        <div class="bingo-letter">I</div>
                        <div class="bingo-letter">N</div>
                        <div class="bingo-letter">G</div>
                        <div class="bingo-letter">O</div>
                    </div>
                    <div class="single-card">
            `;
            
            let seed = cartelaNo * 13;
            let numbers = [];
            while(numbers.length < 24) {
                seed = (seed * 9301 + 49297) % 233280;
                let r = Math.floor((seed / 233280) * 75) + 1;
                if(!numbers.includes(r)) numbers.push(r);
            }

            let cIdx = 0;
            for(let i=0; i<25; i++) {
                if(i === 12) {
                    cardHtml += `<div class="cell free marked">FREE</div>`;
                } else {
                    cardHtml += `<div class="cell" onclick="this.classList.toggle('marked')">${numbers[cIdx++]}</div>`;
                }
            }
            cardHtml += `</div></div>`;
            container.innerHTML = cardHtml;

            speakAmharic("ቁጥሮች መጥራት ጀምረዋል");

            // Live number calling simulation with Amharic speech
            let calledCount = 0;
            callInterval = setInterval(() => {
                calledCount++;
                let randNum = Math.floor(Math.random() * 75) + 1;
                let letter = randNum <= 15 ? 'B' : randNum <= 30 ? 'I' : randNum <= 45 ? 'N' : randNum <= 60 ? 'G' : 'O';
                let callText = `${letter} ${randNum}`;
                
                let callBox = document.getElementById("currentCallBox");
                if(callBox) callBox.innerText = `Current Call: ${callText}`;
                
                let calledVal = document.getElementById("calledVal");
                if(calledVal) calledVal.innerText = calledCount;

                speakAmharic(callText);
            }, 4000);
        }

        function claimBingo() {
            if(callInterval) clearInterval(callInterval);
            speakAmharic("ቢንጎ ማረጋገጫ በመካሄድ ላይ ነው።");
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "claim_bingo" }));
            }
            alert("🎉 Bingo claim submitted! Winner verification in progress...");
        }

        function switchTab(tab) {
            if(callInterval) clearInterval(callInterval);
            if(tab === 'wallet') alert("Wallet: Use /deposit or /withdraw in Telegram chat.");
            else if(tab === 'profile') alert("Guder Bingo Profile Player Account");
            else if(tab === 'history') alert("Session history view.");
            else renderSelectionBoard();
        }

        initApp();
    </script>
</body>
</html>
