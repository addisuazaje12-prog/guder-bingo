<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guder Bingo / ግርር ቢንጎ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .wallet-card {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .status-badge {
            background: #065f46;
            color: #34d399;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-align: center;
            margin-bottom: 12px;
        }
        .timer-box {
            background: #d97706;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .calling-feed {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            color: #facc15;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 5px;
            background: #0f172a;
            border-radius: 6px;
        }
        .cartela-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 2px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .cartela-btn:hover { background: #0284c7; }
        .cartela-btn.selected { background: #16a34a; font-weight: bold; }
        .action-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Guder Bingo / ግርር ቢንጎ</h1>
    <div class="subtitle">እንኳን ወደ ግርር ቢንጎ በደህና መጡ! / Welcome to Guder Bingo!</div>

    <div class="status-badge">Connected securely / ደህንነቱ የተጠበቀ ነው</div>

    <div class="wallet-card">
        <div>
            <div style="font-size: 0.75rem; color: #94a3b8;">MY WALLET / የዕቃ ቦርሳ</div>
            <div id="balance-display" style="font-size: 1.2rem; font-weight: bold; color: #38bdf8;">0.00 ETB</div>
        </div>
        <button onclick="refreshWallet()" style="background:#0284c7; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Refresh / አድስ</button>
    </div>

    <div id="room-status-box" class="timer-box">Loading room state...</div>

    <div class="calling-feed">
        📢 Called Number / የተጠራ ቁጥር: <span id="latest-number" style="font-size: 1.5rem; font-weight: bold;">--</span>
    </div>

    <div style="font-size: 0.85rem; margin-bottom: 5px;">Select Cartela (1–800) / ካርቴላ ይምረጡ:</div>
    <div class="grid-container" id="cartela-grid"></div>

    <div style="font-size: 0.85rem; margin-bottom: 5px;">Selected Cartela / የተመረጠው ካርቴላ ቁጥር:</div>
    <input type="text" id="selected-cartela-input" readonly style="width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; margin-bottom: 10px;" placeholder="None selected">

    <button class="action-btn" onclick="selectCartela()">SELECT CARTELA (10 ETB) / ካርቴላ መረጠ (10 ብር)</button>
    <button class="action-btn" style="background: #16a34a;" onclick="depositFunds()">+ Deposit / ማስገባት (50 ETB)</button>
</div>

<script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
        tg.expand();
    }
    const initData = tg?.initData || "";

    let selectedCartelaNo = null;

    // Build Cartela Grid 1-800
    const gridEl = document.getElementById('cartela-grid');
    for (let i = 1; i <= 800; i++) {
        let btn = document.createElement('button');
        btn.className = 'cartela-btn';
        btn.innerText = i;
        btn.onclick = () => {
            document.querySelectorAll('.cartela-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedCartelaNo = i;
            document.getElementById('selected-cartela-input.value', i);
            document.getElementById('selected-cartela-input').value = i;
        };
        gridEl.appendChild(btn);
    }

    async function fetchGameState() {
        try {
            let res = await fetch('/api/game/state', {
                headers: { 'X-Telegram-Init-Data': initData }
            });
            let data = await res.json();
            if (data.status === 'success') {
                document.getElementById('balance-display').innerText = data.balance.toFixed(2) + ' ETB';
                
                let room = data.room;
                let timerBox = document.getElementById('room-status-box');
                
                if (room) {
                    if (room.status === 'OPEN') {
                        timerBox.innerText = `Selection Phase / የምረቃ ጊዜ: ${room.selection_remaining}s remaining - Pot: ${room.total_pot} ETB`;
                    } else if (room.status === 'PREPARING') {
                        timerBox.innerText = `Preparing Round / ዝግጅት: ${room.preparation_remaining}s remaining`;
                    } else if (room.status === 'RUNNING') {
                        timerBox.innerText = `LIVE PLAYING / ጨዋታ በሂደት ላይ - Pot: ${room.total_pot} ETB`;
                    } else if (room.status === 'COMPLETED') {
                        timerBox.innerText = `Round Completed / ጨዋታው ተጠናቀቀ`;
                    }
                }

                if (data.called_numbers && data.called_numbers.length > 0) {
                    let latest = data.called_numbers[data.called_numbers.length - 1];
                    document.getElementById('latest-number').innerText = latest.number;
                } else {
                    document.getElementById('latest-number').innerText = 'Waiting...';
                }
            }
        } catch (err) {
            console.error("State fetch error:", err);
        }
    }

    async function refreshWallet() {
        fetchGameState();
    }

    async function depositFunds() {
        try {
            let res = await fetch('/api/deposit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': initData
                },
                body: JSON.stringify({ amount: 50.0 })
            });
            let data = await res.json();
            alert(data.message);
            fetchGameState();
        } catch (err) {
            alert("Deposit error");
        }
    }

    async function selectCartela() {
        if (!selectedCartelaNo) {
            alert("Please select a cartela number first!");
            return;
        }
        let dummyMatrix = [[1,2,3],[4,5,6],[7,8,9]];
        try {
            let res = await fetch('/api/cartela/select', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': initData
                },
                body: JSON.stringify({ room_id: 1, cartela_no: selectedCartelaNo, numbers: dummyMatrix })
            });
            let data = await res.json();
            if (data.status === 'success') {
                alert(data.message);
                fetchGameState();
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert("Selection error");
        }
    }

    // Poll game state every 2 seconds
    setInterval(fetchGameState, 2000);
    fetchGameState();
</script>

</body>
</html>
