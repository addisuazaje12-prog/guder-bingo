<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h2 {
            margin-bottom: 15px;
            color: #ffffff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 350px;
            width: 100%;
            margin-bottom: 20px;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #2a2a2a;
            border: 2px solid #333333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }
        .cell.marked {
            background-color: #0088cc;
            border-color: #00a8ff;
            color: #ffffff;
            transform: scale(0.95);
        }
        .cell.free {
            background-color: #ff9900;
            border-color: #ffaa00;
            color: #000000;
        }
        .action-btn {
            background-color: #28a745;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .shortcuts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 350px;
            width: 100%;
        }
        .shortcut-btn {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>🌊 GUDER BINGO 🌊</h2>

    <div class="grid" id="bingoBoard"></div>

    <button class="action-btn" onclick="claimBingo()">🎉 BINGO!</button>

    <div class="shortcuts">
        <button class="shortcut-btn" onclick="showLogs()">📊 Session Logs</button>
        <button class="shortcut-btn" onclick="showDepositInfo()">💳 Deposit Info</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const board = document.getElementById('bingoBoard');
        const numbers = Array.from({length: 75}, (_, i) => i + 1);
        
        // Shuffle helper
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        const selectedNumbers = shuffle(numbers).slice(0, 24);
        let cellIndex = 0;

        // Generate 5x5 Grid
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            
            if (i === 12) {
                cell.textContent = "FREE";
                cell.classList.add('free', 'marked');
            } else {
                cell.textContent = selectedNumbers[cellIndex];
                cellIndex++;
                cell.addEventListener('click', () => {
                    cell.classList.toggle('marked');
                });
            }
            board.appendChild(cell);
        }

        function claimBingo() {
            tg.showAlert("Checking your BINGO claim...");
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "claim_bingo" }));
            }
        }

        function showLogs() {
            tg.showAlert("Session Logs are recorded on the manager backend server.");
        }

        function showDepositInfo() {
            tg.showAlert("Send Telebirr deposit to: 0913706670, then inform your manager.");
        }
    </script>
</body>
</html>
