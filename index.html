<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guder Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #2b1f3d;
            --text-color: #ffffff;
            --button-color: #7b2cbf;
            --card-bg: #4a3b6c;
            --marked-color: #2ec4b6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
        }
        .top-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 400px;
            background: #4a3b6c;
            padding: 6px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.75rem;
        }
        .top-stats div span {
            display: block;
            font-weight: bold;
            font-size: 0.8rem;
            color: #ffaa00;
        }
        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }
        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-height: 250px;
            overflow-y: auto;
            width: 100%;
            margin-bottom: 15px;
            padding: 5px;
        }
        .cartela-opt {
            aspect-ratio: 1;
            background-color: #f77f00;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* B-I-N-G-O Header styling with red color letters */
        .bingo-card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #3c2a59;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .bingo-header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 260px;
            margin-bottom: 6px;
        }
        .bingo-letter {
            aspect-ratio: 1;
            background-color: #d90429; /* Red color for B-I-N-G-O letters */
            color: #fff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .single-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 260px;
        }
        .cell {
            aspect-ratio: 1;
            background-color: var(--card-bg);
            color: #ffffff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .cell.marked { background-color: var(--marked-color); color: #000; }
        .cell.free { background-color: #ff2a4b; color: #fff; }
        
        .insufficient-box {
            color: #ff4d4d;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            background: rgba(255,0,0,0.1);
            border-radius: 8px;
            width: 80%;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            background: #1c1427;
            padding: 10px 0;
            border-radius: 12px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 3px;
        }
        .game-footer-actions {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }
        .game-footer-actions button {
            flex: 1;
            padding: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-leave { background-color: #d90429; color: #fff; }
        .btn-refresh { background-color: #0077b6; color: #fff; }
        .btn-bingo { background-color: #ffb703; color: #000; }
    </style>
</head>
<body>

    <!-- Top Stats (Calling Board View)[cite: 7] -->
    <div class="top-stats" id="topStats" style="display:none;">
        <div>Game ID<span>1_57EP7CEM</span></div>
        <div>Derash<span id="derashVal">4208</span></div>
        <div>Players<span id="playerVal">526</span></div>
        <div>Stake<span>10</span></div>
        <div>Called<span id="calledVal">8</span></div>
    </div>

    <div class="main-container" id="mainContainer">
        <!-- Dynamic Content -->
    </div>

    <!-- Bottom Navigation / Actions -->
    <div id="bottomNavContainer">
        <div class="bottom-nav">
            <button class="nav-btn" onclick="switchTab('game')">🎮 Game</button>
            <button class="nav-btn" onclick="switchTab('history')">📜 History</button>
            <button class="nav-btn" onclick="switchTab('wallet')">💳 Wallet</button>
            <button class="nav-btn" onclick="switchTab('profile')">👤 Profile</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userBalance = 15.0; // Simulated user balance check (set < 10 to test insufficient funds)

        function initApp() {
            renderSelectionBoard();
        }

        function renderSelectionBoard() {
            document.getElementById("topStats").style.display = "none";
            document.getElementById("bottomNavContainer").innerHTML = `
                <div class="bottom-nav">
                    <button class="nav-btn" onclick="switchTab('game')">🎮 Game</button>
                    <button class="nav-btn" onclick="switchTab('history')">📜 History</button>
                    <button class="nav-btn" onclick="switchTab('wallet')">💳 Wallet</button>
                    <button class="nav-btn" onclick="switchTab('profile')">👤 Profile</button>
                </div>
            `;

            const container = document.getElementById("mainContainer");
            if (userBalance < 10.0) {
                container.innerHTML = `<div class="insufficient-box">Insufficient amount</div>`;
                return;
            }

            let html = `<div style="margin-bottom:8px; font-size:0.85rem;">Select Cartela (1 - 400):</div><div class="cartela-grid">`;
            for(let i=1; i<=400; i++) {
                html += `<div class="cartela-opt" onclick="joinGame(${i})">${i}</div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function joinGame(cartelaNo) {
            if (userBalance < 10.0) {
                alert("Insufficient amount");
                return;
            }

            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "join_round", cartela_no: cartelaNo }));
            }

            renderCallingBoard(cartelaNo);
        }

        function renderCallingBoard(cartelaNo) {
            document.getElementById("topStats").style.display = "grid";
            document.getElementById("bottomNavContainer").innerHTML = `
                <div class="game-footer-actions">
                    <button class="btn-leave" onclick="renderSelectionBoard()">Leave</button>
                    <button class="btn-refresh" onclick="window.location.reload()">Refresh</button>
                    <button class="btn-bingo" onclick="claimBingo()">Bingo!</button>
                </div>
            `;

            const container = document.getElementById("mainContainer");
            
            let cardHtml = `
                <div style="font-size:0.85rem; color:#ffb703; margin-bottom:5px;">Cartela #${cartelaNo}</div>
                <div class="bingo-card-container">
                    <!-- Red B-I-N-G-O Headers -->
                    <div class="bingo-header-row">
                        <div class="bingo-letter">B</div>
                        <div class="bingo-letter">I</div>
                        <div class="bingo-letter">N</div>
                        <div class="bingo-letter">G</div>
                        <div class="bingo-letter">O</div>
                    </div>
                    <div class="single-card">
            `;
            
            let seed = cartelaNo * 13;
            let numbers = [];
            while(numbers.length < 24) {
                seed = (seed * 9301 + 49297) % 233280;
                let r = Math.floor((seed / 233280) * 75) + 1;
                if(!numbers.includes(r)) numbers.push(r);
            }

            let cIdx = 0;
            for(let i=0; i<25; i++) {
                if(i === 12) {
                    cardHtml += `<div class="cell free marked">FREE</div>`;
                } else {
                    cardHtml += `<div class="cell" onclick="this.classList.toggle('marked')">${numbers[cIdx++]}</div>`;
                }
            }
            cardHtml += `</div></div>`;
            container.innerHTML = cardHtml;
        }

        function claimBingo() {
            if (tg.sendData) {
                tg.sendData(JSON.stringify({ action: "claim_bingo" }));
            }
            alert("🎉 Bingo claim submitted!");
        }

        function switchTab(tab) {
            if(tab === 'wallet') alert("Wallet: Use /deposit or /withdraw in Telegram chat.");
            else if(tab === 'profile') alert("Guder Bingo Profile Player Account");
            else if(tab === 'history') alert("Session history view.");
            else renderSelectionBoard();
        }

        initApp();
    </script>
</body>
</html>
