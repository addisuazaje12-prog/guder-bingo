<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Guder Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #121212);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #0088cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: #1e1e1e;
      --marked-color: #2ec4b6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 24px; color: #ff9f1c; }
    .user-info { font-size: 14px; opacity: 0.8; margin-top: 4px; }
    .bingo-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 320px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .cell {
      aspect-ratio: 1;
      background: #2a2a2a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .cell.selected { background: var(--marked-color); color: #000; }
    .cell.free { background: #e71d36; font-size: 12px; }
    .actions { margin-top: 20px; width: 100%; max-width: 320px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background-color: var(--button-color); color: var(--button-text-color);
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌊 Guder Bingo</h1>
    <div class="user-info" id="user-greeting">Welcome Player!</div>
  </div>
  <div class="bingo-board" id="board"></div>
  <div class="actions">
    <button class="btn" onclick="claimBingo()">BINGO!</button>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('user-greeting').innerText = `Player: ${tg.initDataUnsafe.user.first_name}`;
    }
    const boardElement = document.getElementById('board');
    function generateBoard() {
      boardElement.innerHTML = '';
      const numbers = Array.from({length: 75}, (_, i) => i + 1).sort(() => 0.5 - Math.random());
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if (i === 12) {
          cell.innerText = 'FREE';
          cell.classList.add('selected', 'free');
        } else {
          cell.innerText = numbers[i];
          cell.onclick = () => cell.classList.toggle('selected');
        }
        boardElement.appendChild(cell);
      }
    }// Navigation Button Actions
function openDeposit() {
    tg.showAlert("Opening Deposit menu...");
}

function openWithdraw() {
    tg.showAlert("Opening Withdraw menu...");
}

function openSupport() {
    window.Telegram.WebApp.openLink("https://t.me/your_support_username");
}

function openInstructions() {
    tg.showAlert("Game Instructions: Tap numbers to mark your cartela, get a line, and click BINGO!");
}

function openInvite() {
    window.Telegram.WebApp.openTelegramLink("https://t.me/share/url?url=https://t.me/guderbingo_bot");
}
    function claimBingo() { tg.showAlert("🎉 Congratulations! You declared Bingo!"); }
    generateBoard();
  </script><div class="menu-bar" style="text-align: center; margin: 15px 0;">
  <button onclick="openDeposit()">Deposit</button>
  <button onclick="openWithdraw()">Withdraw</button>
  <button onclick="openSupport()">Support</button>
  <button onclick="openInstructions()">Instructions</button>
  <button onclick="openInvite()">Invite</button>
</div>
</body>
</html>
